:root[data-theme-style="prism"] {
    color-scheme: dark;
    --bg: #1b232b;
    --bg-card: #27323b;
    --bg-hover: rgba(255,255,255,.07);
    --text: #f3f4f6;
    --text-secondary: #c2cbd3;
    --text-muted: #a3afbb;
    --border: rgba(255,255,255,.08);
    --divider-rgb: 235,236,240;
    --accent: #ededf0;
    --accent-hover: #fff;
    --focus: #bfc3ce;
    --radius: 28px;
    --glass: rgba(19,29,38,.38);
    --glass-strong: rgba(25,36,47,.84);
    --card-bottom: #222d36;
    --control-top: rgba(255,255,255,.08);
    --control-bottom: rgba(255,255,255,.025);
    --control-hover-top: rgba(255,255,255,.13);
    --control-hover-bottom: rgba(255,255,255,.05);
    --control-pressed-top: #1c2730;
    --control-pressed-bottom: #24313b;
    --shadow: 0 2px 6px -2px #0003,0 12px 32px -14px #0006;
    --shadow-lg: 0 16px 40px -18px #0009;
    --press-shadow: inset 0 2px 5px #0006,inset 0 -1px #ffffff0c;
    --bookmark-face: transparent;
    --bookmark-hover-face: rgba(255,255,255,.055);
    --bookmark-pressed-face: rgba(255,255,255,.035);
    --bookmark-border: transparent;
    --bookmark-hover-border: rgba(255,255,255,.08);
    --bookmark-pressed-border: rgba(255,255,255,.12);
    --bookmark-idle-shadow: none;
    --bookmark-hover-shadow: inset 0 1px #ffffff09;
    --bookmark-press-shadow: var(--press-shadow);
    --bookmark-lift: 0px;
    --bookmark-press-depth: 1px;
    --bookmark-press-scale: .985;
    --bookmark-glow-opacity: 0;
    --glint: transparent;
    --search-glint: transparent;
    --glint-white: transparent;
    --mode-hue: 220,221,226;
    --engine-hue: 220,221,226;
    --submit-hue: 235,236,240;
    --admin-panel: var(--glass-strong);
    --admin-row: rgba(255,255,255,.025);
    --admin-row-hover: rgba(255,255,255,.045);
    --admin-input-top: rgba(0,0,0,.22);
    --admin-input-bottom: rgba(0,0,0,.12);
    --admin-active: rgba(255,255,255,.07);
    --admin-success: #a6d8bd;
    --admin-error: #ffb3ad;
    --admin-primary-text: #f3f4f6;
    --admin-inner-light: rgba(255,255,255,.075);
    --admin-inner-dark: rgba(0,0,0,.2);
    --admin-field-canvas: #27323b;
    --panel: var(--glass-strong);
    --input-top: #1c2730;
    --input-bottom: #24313b;
    --inner-light: rgba(255,255,255,.09);
    --inner-dark: rgba(0,0,0,.22);
    --code-string: #a6d8bd;
    --code-number: #e5be92;
    --code-title: #aac8f0;
    --code-attr: #d5afd6;
    --code-type: #d9cd9b;
    --code-deletion: #ffb3ad;
    --prism-reflection: linear-gradient(150deg,#ffffff20 0%,#ffffff0a 30%,#ffffff02 65%,#ffffff0c 100%);
    --prism-slab: radial-gradient(ellipse 80% 160% at 0% -70%,#e1f4ff14,transparent 72%),linear-gradient(130deg,#eef8ff08 0%,#ffffff00 42%,#a5dcf608 100%),rgba(255,255,255,.01);
    --prism-slab-shadow: inset 0 1px 1px #ffffff40,inset 1px 0 #ffffff14,inset 0 -1px 1px #0000002e,0 4px 8px -6px #0005,0 20px 44px -24px #0009;
    --prism-pill: linear-gradient(175deg,#ffffff26 0%,#ffffff0b 38%,#ffffff02 65%,#ffffff08 100%),rgba(18,29,39,.24);
    --prism-pill-shadow: inset 0 1px 1px #ffffff52,inset 1px 0 #ffffff1a,inset 0 -1px 1px #0004,0 4px 8px -5px #0005,0 14px 32px -20px #0008;
    --prism-edge: linear-gradient(115deg,#f5d477,#d89e77 27%,#c5a8df 62%,#74b6c6);
    --prism-ease: cubic-bezier(.22,1,.36,1);
}

:root[data-theme-style="prism"] body {
    font-family: 'Habu Inter Tight','SF Pro Display','PingFang SC','Microsoft YaHei',sans-serif;
    /* 静态大范围环境光随文档延伸，长页面下半部仍保留青灰层次。
       这里刻意**不用** background-attachment: fixed：Windows 上固定背景
       会在每次滚动时重绘，实测棱镜滚动一次的 PictureLayer::Update 由
       164 升到 205（每帧多一次整屏背景），是经典主题没有的开销。
       背景随文档滚动后，顶部暖光留在首屏、底部冷光落在文档尾部，层次不变。 */
    background: radial-gradient(ellipse 72vw 70vh at 4% -10%,#c4a77d26,transparent 72%),radial-gradient(ellipse 75vw 85vh at 100% 12%,#76aebd29,transparent 74%),radial-gradient(ellipse 80vw 65vh at 44% 110%,#7d94bc1a,transparent 76%),linear-gradient(165deg,#252e36,var(--bg) 55%,#202b35);
    background-color: var(--bg);
    background-repeat: no-repeat;
}
:root[data-theme-style="prism"] :is(button,input,textarea,select) { font-family: inherit; }
:root[data-theme-style="prism"] ::selection { background: #ffffff30; color: #fff; }
:root[data-theme-style="prism"] :is(input,textarea) { caret-color: var(--text); }
:root[data-theme-style="prism"] * { scrollbar-color: #647584 #1b232b; scrollbar-width: thin; }

/* 将原背板让给内容卡片，保留布局计算与拖动的宿主。 */
:root[data-theme-style="prism"] .backboard { background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
:root[data-theme-style="prism"] :is(.backboard,.bookmark)::before,
:root[data-theme-style="prism"] :is(.backboard,.bookmark,.search)::after { display: none; }
:root[data-theme-style="prism"] .grid { gap: 20px; }
:root[data-theme-style="prism"] :is(.category,.module-widget) {
    border: 1px solid #ffffff0b;
    border-radius: 32px;
    background: var(--prism-slab);
    box-shadow: inset 0 1px 0 #ffffff12,inset 0 -1px 0 #bce6ff08,0 10px 28px -20px #0006;
    /* 分类板与模块板**不加 backdrop-filter**：页面底子是一层平滑的冷暖渐变，
       20px 模糊在上面几乎看不出来，但每张卡片在滚动时都要重新采样背景。
       实测棱镜滚动一次的 PictureLayer::Update：带卡片模糊 328、去掉后 205，
       再去掉固定背景才是与经典主题一致的 164。玻璃感由薄膜渐变、内侧受光与
       光学薄边承担，与「无背景模糊」「少透明」两条降级路径的结论相同。 */
    transition: border-color 200ms var(--prism-ease),box-shadow 200ms var(--prism-ease),margin-top 180ms var(--prism-ease);
}
:root[data-theme-style="prism"] .category { position: relative; padding: 20px 24px; }
:root[data-theme-style="prism"] :is(.category,.module-widget):hover { border-color: #ffffff14; box-shadow: inset 0 1px 0 #ffffff1a,inset 0 -1px 0 #bce6ff10,0 14px 32px -22px #0007; }
/* 掩膜只保留薄边，亮点沿曲面分布，不在文字上方叠加反光层。
   分类板与模块板用同一层材质——用户指认的「导航主体部分的各个模块尤其是各类的
   背景板」是同一个诉求，模块板若只拿到底色不拿薄边，页面上仍是两套卡片语言。
   模块板的包含块：两侧停靠时 .module-widget 本身是 absolute，窄屏 below 停靠
   时由 styles.css 那条规则给成 relative，两种停靠都有位置可依。 */
@supports (mask-composite: exclude) or (-webkit-mask-composite: xor) {
    :root[data-theme-style="prism"] :is(.category,.module-widget)::after {
        content: '';
        position: absolute;
        inset: -1px;
        padding: 1.5px;
        border-radius: inherit;
        pointer-events: none;
        background: radial-gradient(ellipse 65% 140% at 0% 0%,#ffffff90,transparent 68%),radial-gradient(ellipse 55% 130% at 100% 100%,#b8eaff68,transparent 70%),linear-gradient(125deg,#ffffff20,#ffffff03 40%,#d4f1ff14);
        -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: .5;
        transition: opacity 200ms var(--prism-ease);
    }
    :root[data-theme-style="prism"] :is(.category,.module-widget):hover::after { opacity: .8; }
}
:root[data-theme-style="prism"] .category-header { margin-bottom: 12px; padding-bottom: 0; background: none; border: 0; }
:root[data-theme-style="prism"] .category-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: var(--text); text-transform: none; line-height: 1.25; }
:root[data-theme-style="prism"] :is(.bookmark,.bookmark-text-only) {
    border-radius: 12px;
    --bookmark-face: linear-gradient(175deg,#ffffff24 0%,#ffffff0b 45%,#00000009 100%),rgba(20,31,41,.16);
    --bookmark-hover-face: linear-gradient(175deg,#ffffff32 0%,#ffffff13 45%,#ffffff04 100%),rgba(20,31,41,.22);
    --bookmark-pressed-face: linear-gradient(180deg,#00000020,#ffffff04),rgba(31,41,49,.45);
    --bookmark-border: rgba(255,255,255,.10);
    --bookmark-hover-border: rgba(255,255,255,.22);
    --bookmark-idle-shadow: inset 0 1px 1px #ffffff30,inset 0 -1px #0004,0 4px 8px -5px #0008;
    --bookmark-hover-shadow: inset 0 1px 1px #ffffff45,inset 0 -1px #0004,0 7px 14px -7px #0009;
    --bookmark-lift: -1px;
}

:root[data-theme-style="prism"] :is(.search,.search:hover,.search:focus-within) {
    min-height: 62px;
    padding: 8px;
    border: 1px solid #ffffff14;
    border-radius: 999px;

   做法是**改 token 而不是逐个改元素**——所有用到薄膜与胶囊的部件自动拿到哑光版。 */
@media (prefers-reduced-transparency: reduce) {

    :root[data-theme-style="prism"] :is(.category,.module-widget,.search,.search:hover,.search:focus-within,.modal-content,.fav-dialog,.ui-dialog,.module-panel,.container,.engine-dropdown,.fav-dropdown,.help-content,.toast) { backdrop-filter: none; -webkit-backdrop-filter: none; }
}
/* 浏览器没有背景模糊时**不要**退回不透明卡片：那正是 v2.2.5 那种死板厚重的底板，
   用户点名的就是它。分类板与模块板保留透明薄膜与光学薄边——页面底子是一层平滑的
   冷暖渐变，少一层模糊几乎看不出来；真正需要不透明底的是盖在任意内容上的浮层

   正落在这类机器上，于是整页退回旧样式。 */

/* ================= 模块区排布（移植产品平台的同一套判据） ================= */

/**
 * 三列宽度的连续解：左侧普通模块列、时间线宽列、中间导航背板。
 * 与 app.js 的 railLayoutFor() 同源——Special Line 声明了 wideRail，
 * 需要一条真宽度的列，放不下就整体退回「模块在下方横排」。
 */
function railLayoutFor(content) {
    const GAP = 20;
    const SIDE_MIN = 280, SIDE_MAX = 320;
    const BOARD_MIN = 600, BOARD_MAX = 936;
    const RAIL_MIN = 400, RAIL_MAX = 440;

    let side = SIDE_MAX;
    let rail = RAIL_MAX;
    let board = content - 2 * GAP - side - rail;

    if (board > BOARD_MAX) {
        board = BOARD_MAX;
        rail = Math.min(RAIL_MAX, content - 2 * GAP - side - board);
    }
    if (board < BOARD_MIN) {
        rail = Math.max(RAIL_MIN, content - 2 * GAP - side - BOARD_MIN);
        board = content - 2 * GAP - side - rail;
    }
    if (board < BOARD_MIN) {
        side = Math.max(SIDE_MIN, content - 2 * GAP - BOARD_MIN - rail);
        board = content - 2 * GAP - side - rail;
    }
    if (board < BOARD_MIN || rail < RAIL_MIN) return null;
    return { side, board, rail };
}

function syncRail() {
    const app = $('#app');
    const content = app.getBoundingClientRect().width - 22 * 2;
    const layout = railLayoutFor(content);
    app.dataset.rail = layout ? 'wide' : 'narrow';
    const vars = {
        '--rail-w': layout && layout.rail,
        '--side-w': layout && layout.side,
        '--board-max': layout && layout.board
    };
    for (const key of Object.keys(vars)) {
        if (vars[key]) app.style.setProperty(key, vars[key] + 'px');
        else app.style.removeProperty(key);
    }
    return layout;
}

function sideDockAvailable(boardWidth) {
    const MIN_SIDE = 280;
    const GAP = 20;
    const board = $('.backboard');
    const app = $('#app');
    if (!board || !app) return false;
    const measured = Number.isFinite(boardWidth) ? boardWidth : board.getBoundingClientRect().width;
    const appWidth = app.getBoundingClientRect().width;
    const side = (appWidth - 22 * 2 - measured) / 2;
    return side >= MIN_SIDE + GAP;
}

/** 模块列顶端对齐搜索框，而不是钉在页面最上沿（数值实测，不写死）。 */
function alignModuleTop() {
    const app = $('#app');
    const zone = $('#moduleZone');
    if (!app || !zone) return;
    if (zone.dataset.dock !== 'outside') {
        app.style.removeProperty('--module-top');
        return;
    }
    const header = $('.header');
    if (!header) return;
    const top = Math.round(header.getBoundingClientRect().top - app.getBoundingClientRect().top);
    app.style.setProperty('--module-top', top + 'px');
}

function applyDock() {
    const layout = syncRail();
    const zone = $('#moduleZone');
    zone.dataset.dock = sideDockAvailable(layout && layout.board) ? 'outside' : 'below';
    alignModuleTop();
    stackCards();
}

function stackCards() {
    const zone = $('#moduleZone');
    if (!zone || zone.dataset.dock !== 'outside') return;
    const GAP = 14;
    for (const side of ['left', 'right']) {
        const nodes = [...zone.querySelectorAll(`.module-widget[data-side="${side}"]`)];
        for (const node of nodes) node.style.removeProperty('--stack-top');
        let cursor = 0;
        for (const node of nodes) {
            node.style.setProperty('--stack-top', cursor + 'px');
            cursor += node.getBoundingClientRect().height + GAP;
        }
    }
}

let modePref = 'dark';   // 明暗偏好；棱镜只有深色一档，切到经典时恢复

function applyThemeStyle(style) {
    const root = document.documentElement;
    root.setAttribute('data-theme-style', style);
    // 棱镜固定深色（与产品一致：THEMES.prism.mode = 'dark'），
    // 所以这一档下浅色按钮不可用。
    const fixedDark = style === 'prism';
    const lightBtn = $('#demoModeSwitcher button[data-demo-mode="light"]');
    lightBtn.disabled = fixedDark;
    lightBtn.title = fixedDark ? '棱镜只有深色一档' : '切换为浅色';
    $$('#homeThemeSwitcher button').forEach(btn =>
        btn.setAttribute('aria-pressed', String(btn.dataset.homeTheme === style)));
    applyMode(fixedDark ? 'dark' : modePref);
    applyDock();
}

function applyMode(mode) {
    if (mode === 'light' && document.documentElement.getAttribute('data-theme-style') === 'prism') return;
    modePref = mode;
    document.documentElement.setAttribute('data-theme', mode);
    $$('#demoModeSwitcher button').forEach(btn =>
        btn.setAttribute('aria-pressed', String(btn.dataset.demoMode === mode)));
    requestAnimationFrame(stackCards);
}

/* ================= 搜索 ================= */

let favMode = false;
let engine = ENGINES[0];
let filterText = '';

function setMode(next) {
    favMode = next;
    const btn = $('#modeBtn');
    btn.querySelector('[data-label="web"]').hidden = favMode;
    btn.querySelector('[data-label="fav"]').hidden = !favMode;
    btn.setAttribute('aria-pressed', String(favMode));
    btn.setAttribute('aria-label', favMode ? '切换搜索模式，当前为书签' : '切换搜索模式，当前为网页');
    const input = $('#searchInput');
    input.setAttribute('aria-label', favMode ? '搜索书签' : '搜索网页');
    input.placeholder = favMode ? '查书签' : '搜索网页';
    input.value = favMode ? input.value.replace(/^[\/、]{1,2}/, '') : `/${input.value}`;
    applyFilter(input.value);
}

function applyFilter(value) {
    filterText = (favMode ? value : value.replace(/^[\/、]{1,2}/, '')).trim().toLowerCase();
    let hits = 0;
    $$('#grid .bookmark').forEach(el => {
        const title = el.querySelector('.bookmark-title').textContent.toLowerCase();
        const match = !filterText || title.includes(filterText);
        el.hidden = !match;
        if (match) hits++;
    });
    $$('#grid .category').forEach(cat => {
        const visible = $$('.bookmark', cat).some(el => !el.hidden);
        cat.hidden = !visible;
    });
    const count = $('#demoSearchCount');
    if (filterText) {
        count.hidden = false;
        count.textContent = `${hits} 个匹配`;
    } else {
        count.hidden = true;
    }
}

function submitSearch() {
    const input = $('#searchInput');
    const raw = input.value.trim();
    if (favMode) {
        const hit = $$('#grid .bookmark').find(el => !el.hidden);
        if (hit) window.open(hit.href, '_blank', 'noopener');
        else toast('没有匹配的导航');
        return;
    }
    const query = raw.replace(/^[\/、]{1,2}/, '');
    if (!query) { toast('先输入关键词'); return; }
    window.open(engine.url + encodeURIComponent(query), '_blank', 'noopener');
}

        const btn = e.target.closest('[data-demo-mode]');

    // 模块区：备忘 / 待办切换、勾选待办、时间线筛选、收藏、详情

            const item = star.closest('.special-line-item');

            toast(item.dataset.favorited === '1' ? '已加入收藏（演示）' : '已取消收藏（演示）');

                <ul>

    zone.addEventListener('change', (e) => {

        if (!box) return;
        const todo = TODOS[Number(box.dataset.todo)];
        todo.done = box.checked;

        requestAnimationFrame(stackCards);
    });

    // 时间线筛选
    $$('.special-line-chip').forEach(chip => chip.addEventListener('click', () => {
        const isView = chip.hasAttribute('data-view');
        const group = isView ? '[data-view]' : '[data-channel]';
        $$(group).forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
        applyTimelineFilter();
    }));
    $('#syncBtn').addEventListener('click', () => toast('演示页面：没有真实订阅可同步'));
    $('#saveBtn').addEventListener('click', () => toast('演示页面：保存功能未接入'));

    $('#helpBtn').addEventListener('click', () => openModal('关于这个演示', `
        <p>Habu（个人数字工作台）的对外演示页。待办、备忘、订阅时间线与服务器指标都是虚构示例。</p>
        <p>整页是纯静态文件：不连接后台、不发起网络请求、不保存任何数据。</p>
        <p>导航分类指向公开网站，可直接点开体验。</p>`));

    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('#demoModalOverlay').hidden) closeModal();
    });

        window.__demoDockTimer = setTimeout(applyDock, 120);
    });
}

function applyTimelineFilter() {
    const channel = $('.special-line-chip[data-channel][aria-pressed="true"]')?.dataset.channel ?? '';
    const view = $('.special-line-chip[data-view][aria-pressed="true"]')?.dataset.view ?? 'all';
    let visible = 0;
    $$('#eventList .special-line-item').forEach(item => {
        const inChannel = !channel || item.dataset.channel === channel;
        const favorited = item.dataset.favorited === '1';
        const inView = view === 'all' || (view === 'favorited' && favorited) || (view === 'archived' && item.dataset.archived === '1');
        const show = inChannel && inView;
        item.hidden = !show;
        if (show) visible++;
    });
    let empty = $('#eventEmpty');
    if (!visible) {
        if (!empty) {
            empty = document.createElement('div');
            empty.id = 'eventEmpty';
            empty.className = 'special-line-empty';
            empty.innerHTML = '<p>当前筛选下没有内容。演示数据里只有几条示例。</p>';
            $('#eventList').after(empty);
        }
        empty.hidden = false;
    } else if (empty) {
        empty.hidden = true;
    }
}

/* ================= 启动 ================= */

renderGrid();
renderModules();
bind();
applyThemeStyle('prism');
applyMode('dark');
requestAnimationFrame(applyDock);
})();
