  Habu 演示页 · 源模板

  这是给人看的**演示**：所有内容都是虚构示例，不含任何真实账号、服务器地址、
  凭据或私人数据；页面不与后台通信，是一个纯静态文件（零网络请求、零 CPU）。

  本文件是「源」，成品是 public/demo/index.html —— 由 demo/build.js 把产品真实
  的样式表内联进来后生成，它随 public/ 一起发版，服务器上直接以
  https://<你的域名>/demo/ 对外提供（静态文件不经过登录门禁）。

  改样式请改 public/styles.css，改完跑 `node demo/build.js` 重新生成。
-->

<style>
/* ---- public/styles.css ---- */
:root {
    --bg: #fafafa;
    --bg-card: #ffffff;
    --bg-hover: #f0f0f0;
    --text: #1a1a1a;
    --text-secondary: #666;
    --text-muted: #999;
    --border: #e5e5e5;
    --accent: #4a5568;
    --accent-hover: #2d3748;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
    --transition: 200ms ease;
}

/* 跟随系统：深色模式 */
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #0a0a0a;
        --bg-card: #161616;
        --bg-hover: #222;
        --text: #f0f0f0;
        --text-secondary: #a0a0a0;
        --text-muted: #666;
        --border: #2a2a2a;
        --accent: #a0aec0;
        --accent-hover: #cbd5e0;
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
    }
}

/* 强制深色模式 */
:root[data-theme="dark"] {
    --bg: #0a0a0a;
    --bg-card: #161616;
    --bg-hover: #222;
    --text: #f0f0f0;
    --text-secondary: #a0a0a0;
    --text-muted: #666;
    --border: #2a2a2a;
    --accent: #a0aec0;
    --accent-hover: #cbd5e0;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    /* dvh 跟随地址栏展开/收起：不支持 dvh 的浏览器沿用上一行的 100vh */
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
}

.app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
    min-height: 100vh;
    min-height: 100dvh;
}

.header {
    text-align: center;
    margin-bottom: 48px;
}

.search-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
    max-width: 560px;
}

.search {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px;
    gap: 4px;
    width: 100%;
    box-shadow: var(--shadow);
    transition: box-shadow var(--transition), border-color var(--transition);
}

.search:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
}

.search-engine {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: var(--bg-hover);
    border: none;
    border-radius: 999px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
    height: 40px;
}

.search-engine:hover { background: var(--border); color: var(--text); }

.engine-name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }

/* .engine-arrow 的定义已统一到文件尾部的材质层（基础样式 + 展开态翻转）。
   这里原先还有一条 `.search-engine.active .engine-arrow { transform: rotate(180deg) }`，
   已删除：JS 在 app.js:314 同时设 `.active` 类和 aria-expanded，翻转只需一处驱动，
   统一改用语义化的 `[aria-expanded="true"]`，避免同一状态两条规则各自旋转。 */

.search-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 12px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    min-width: 0;
}

.search-input::placeholder { color: var(--text-muted); }

.search-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    transition: all var(--transition);
    flex-shrink: 0;
}

.search-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

.search-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.engine-dropdown {
    position: absolute;
    /* 4px 是搜索框下缘的间距；left 的兜底值对应正常模式
       （1px 表单边框 + 5px 内边距 = 6px）。打开时由 JS 按引擎按钮的
       实测左缘覆盖，模式按钮显隐或窄屏收窄都不会让下拉脱开按钮。 */
    top: calc(100% + 4px);
    left: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 5px;
    z-index: 100;
}

.engine-dropdown[hidden] { display: none; }

@keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.engine-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background var(--transition);
}

.engine-option:hover { background: var(--bg-hover); }
.engine-option.active { background: var(--bg-hover); font-weight: 500; }

.engine-option::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity var(--transition);
}

.engine-option.active::before { opacity: 1; }

.grid {
    display: flex;
    flex-direction: column;
    gap: 40px;
}

.category {
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

.category-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.bookmarks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}

.bookmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    transition: all var(--transition);
    cursor: pointer;
}

.bookmark:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

.bookmark:active, .btn:active, .search-btn:active {
    transform: translateY(1px);
}

.bookmark:focus-visible, .btn:focus-visible,
.search-btn:focus-visible, .search-engine:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.bookmark-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: contain;
    background: var(--bg-hover);
}

.bookmark-title {
    font-size: 13px;
    text-align: center;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
}

.modal[hidden] { display: none; }

.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
}

.modal-content {
    position: relative;
    width: 90%;
    max-width: 900px;
    height: 80vh;
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-header h2 { font-size: 16px; font-weight: 500; }

.modal-actions { display: flex; align-items: center; gap: 8px; }

.config-save-status {
    min-width: 0;
    color: var(--text-secondary);
    font-size: 12px;
}

.config-save-status[data-state="error"] { color: #b93232; }

.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 1100;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 8px;
    background: var(--text);
    color: var(--bg);
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    pointer-events: none;
}

.toast[hidden] { display: none; }

.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.btn {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    transition: all var(--transition);
}

.btn:hover { background: var(--bg-hover); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { color: #e53e3e; border-color: #e53e3e; }
.btn-danger:hover { background: #e53e3e; color: white; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.section { margin-bottom: 32px; }
.section:last-child { margin-bottom: 0; }
.section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
}

.item:last-child { margin-bottom: 0; }

.item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.item-row:last-child { margin-bottom: 0; }

.item-row input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 14px;
}

.item-row input:focus { outline: none; border-color: var(--accent); }

.item-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.item-header input { flex: 1; font-weight: 500; }

.add-btn {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    margin-top: 12px;
}

.add-btn:hover { border-color: var(--accent); color: var(--accent); }

@media (max-width: 768px) {
    .app { padding: 32px 16px; }
    .header { margin-bottom: 32px; position: relative; }
    .grid { gap: 32px; }
    .bookmarks { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .bookmark { padding: 16px 8px; }
    .modal-content { width: 95%; max-height: 90vh; border-radius: 8px; }
    .modal-header { padding: 12px 16px; }
    .modal-header h2 { font-size: 14px; }
    .modal-body { padding: 12px; }
    .modal-actions { gap: 6px; }
    .btn { padding: 6px 12px; font-size: 13px; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .section { margin-bottom: 20px; }
    .item { padding: 10px; }
    .item-row { flex-wrap: wrap; }
    .item-row input { flex: 1 1 calc(50% - 4px); min-width: 0; font-size: 13px; padding: 8px 10px; }
    .item-row .btn { flex: 0 0 100%; margin-top: 4px; }
    .item-header { flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .item-header input { flex: 1; min-width: 120px; font-size: 13px; padding: 6px 10px; }
    .add-btn { padding: 8px; font-size: 12px; }
    .search { max-width: 100%; }
    .search-engine { padding: 8px 12px; height: 36px; }
    .engine-name { max-width: 60px; font-size: 12px; }
    .search-input { padding: 10px 12px; font-size: 16px; }
    .search-btn { width: 36px; height: 36px; }
    .search-btn svg { width: 16px; height: 16px; }
    /* 下拉位置与宽度由 JS 按按钮实际尺寸设置，窄屏不再改写 left 或 min-width。 */
}

@media (max-width: 480px) {
    .app { padding: 24px 12px; }
    .bookmarks { grid-template-columns: repeat(3, 1fr); }
    .bookmark { padding: 12px 6px; }
    .bookmark-icon { width: 24px; height: 24px; }
    .bookmark-title { font-size: 12px; }
    .modal-content { width: 100%; max-height: 100vh; border-radius: 0; }
    .modal-header { position: sticky; top: 0; background: var(--bg-card); z-index: 10; }
    .item-row input { flex: 1 1 100%; }
    .item-header { gap: 4px; }
    .item-header input { min-width: 80px; }
    .search-engine { padding: 6px 10px; height: 32px; }
    .engine-name { max-width: 50px; }
    .search-input { padding: 8px 10px; font-size: 16px; }
    .search-btn { width: 32px; height: 32px; }

    /* 窄屏管理面板的调整放在 admin.css 的 ≤480px 块里：那个文件在
       styles.css 之后加载，且用的是 `.modal .fav-actions` 这类更高特异性的
       选择器，在这里写会被静默覆盖（本次实测踩过：头部仍停在 118.5px）。 */
}

[hidden] { display: none !important; }

/* 搜索栏的外观过渡。 */
.search { transition: min-height var(--transition), padding var(--transition), border-radius var(--transition), border-color 160ms, box-shadow 160ms, background 160ms; }

@media (max-width: 768px) {
}

/* 帮助弹窗 */
.help-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s ease;
}

.help-content {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: var(--shadow-lg);
}

.help-content h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
}

.help-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: none;
    background: var(--bg-hover);
    color: var(--text-muted);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.help-close:hover {
    background: var(--border);
    color: var(--text);
}

.help-section {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.help-section:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.help-section strong {
    display: block;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 8px;
}

.help-section p {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 4px 0;
    line-height: 1.5;
}

.help-section .help-tip {
    font-size: 11px;
    color: var(--text-muted);
    margin: 2px 0 2px 12px;
}

.help-section .help-tip::before {
    content: "•";
    margin-right: 6px;
}

.help-section code {
    background: var(--bg-hover);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Menlo', monospace;

}

.help-note {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

/* 移动端适配 */
@media (max-width: 768px) {

    .help-content {
        padding: 20px;
    }
}

/* ========== Settings Row ========== */
.setting-row {
    display: flex;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
    border-bottom: none;
}

.setting-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 16px;
    font-size: 14px;
    color: var(--text);
}

.setting-row select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 14px;
    min-width: 140px;
    cursor: pointer;
    transition: border-color var(--transition);
}

.setting-row select:focus {
    outline: none;
    border-color: var(--accent);
}

/* ========== Toggle Switch ========== */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    border-radius: 24px;
    transition: 0.3s;
}

.toggle-slider:before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.3s;
}

.toggle-switch input:checked + .toggle-slider {
    background-color: var(--accent);
}

.toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(20px);
}

.btn-danger {
    background: #ef4444;
    color: white;
    border: none;
}

.btn-danger:hover {
    background: #dc2626;
}

/* ========== Text-Only Bookmark Mode ========== */
.bookmark-text-only {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    transition: all var(--transition);
    cursor: pointer;
    min-height: auto;
}

.bookmark-text-only:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
    background: var(--bg-hover);
}

.bookmark-text-only:active {
    transform: translateY(0);
}

.bookmark-text-only .bookmark-title {
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    margin: 0;
    display: block;
    -webkit-line-clamp: 1;
}

}

@media (max-width: 480px) {
    .bookmark-text-only {
        padding: 14px 12px;
        min-height: 48px;
    }

    .bookmark-text-only .bookmark-title {
        font-size: 14px;
    }
}

/* ========== 书签模糊检索 ========== */

/* 检索模式样式 */
.search.fav-search-mode {
    border-color: var(--accent);
}

/* 原本这里有一条 `.search.fav-search-mode .search-btn { background:#f59e0b }`：
   书签态的「打开」按钮是琥珀色。它是旧按钮的配色，材质层改成实心陶土后
   它以 (0,3,0) 的特异性压过 (0,1,0) 的 .search-btn，实心底被换成琥珀底。
   主操作在网页态与书签态应是同一种材质，删除而非覆盖。 */

/* 检索下拉 */
.fav-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    max-height: 400px;
    overflow-y: auto;
    z-index: 100;
    animation: dropIn 0.15s ease;
}

.fav-dropdown[hidden] { display: none; }

.fav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    transition: background var(--transition);
}

.fav-item:last-child { border-bottom: none; }
.fav-item:hover, .fav-item.selected { background: var(--bg-hover); }

.fav-icon {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    object-fit: contain;
    background: var(--bg-hover);
    flex-shrink: 0;
}

.fav-info {
    flex: 1;
    min-width: 0;
}

.fav-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fav-title mark {
    background: #fef08a;
    color: inherit;
    padding: 0 1px;
    border-radius: 2px;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .fav-title mark {
        background: #854d0e;
    }
}

:root[data-theme="dark"] .fav-title mark {
    background: #854d0e;
}

.fav-private-icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
    vertical-align: middle;
    margin-right: 2px;
    flex-shrink: 0;
}

.fav-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
}

.fav-category {
    background: var(--bg-hover);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--text-secondary);
    font-size: 10px;
}

.fav-host {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fav-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
}

/* 管理面板收藏夹区域 */
.fav-stats {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 12px;
}

.fav-stats code {
    background: var(--bg-hover);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
}

.fav-hint {
    font-size: 12px;
    color: var(--text-muted);
}

.fav-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

/* 收藏管理器 */
.fav-manager-header {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.fav-manager-search {
    flex: 1;
    min-width: 150px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
}

.fav-manager-search:focus {
    outline: none;
    border-color: var(--accent);
}

.fav-category-filter {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-width: 120px;
}

.fav-manager-stats {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding: 0 4px;
}

.fav-manager-list {
    flex: 1;
    overflow-y: auto;
    min-height: 200px;
}

.fav-manager-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
}

.fav-manager-icon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    flex-shrink: 0;
}

.fav-manager-info {
    flex: 1;
    min-width: 0;
}

.fav-manager-title {
    font-weight: 500;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fav-manager-title-link {
    text-decoration: none;
    color: inherit;
    display: block;
}

.fav-manager-title-link:hover .fav-manager-title {
    color: var(--accent);
    text-decoration: underline;
}

.fav-manager-url {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}

.fav-manager-category {
    font-size: 10px;
    background: var(--bg-hover);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
}

.fav-manager-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}

.fav-manager-footer {
    margin-top: 12px;
}

.fav-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.fav-page-info {
    font-size: 13px;
    color: var(--text-secondary);
    min-width: 60px;
    text-align: center;
}

/* 添加/编辑对话框 */
.fav-dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    padding: 20px;
}

.fav-dialog {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-lg);
}

.fav-dialog h3 {
    font-size: 16px;
    margin-bottom: 16px;
}

.fav-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.fav-form input,
.fav-form select {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
}

.fav-form input:focus,
.fav-form select:focus {
    outline: none;
    border-color: var(--accent);
}

.fav-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 14px;
}

.fav-checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.fav-category-row {
    display: flex;
    gap: 8px;
}

.fav-category-row select {
    flex: 1;
    min-width: 0;
}

.fav-category-row input {
    flex: 1;
    min-width: 0;
}

.fav-dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .fav-dropdown {
        max-height: min(60vh, 400px);
        max-height: min(60dvh, 400px);
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        bottom: auto;
        border-radius: 11px;
        box-shadow: var(--shadow-lg);
        animation: dropIn 0.15s ease;
    }

    @keyframes slideUpMobile {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }

    .fav-item {
        padding: 12px 14px;
        gap: 12px;
        -webkit-tap-highlight-color: transparent;
    }

    .fav-item:active {
        background: var(--bg-hover);
    }

    .fav-icon {
        width: 22px;
        height: 22px;
    }

    .fav-title {
        font-size: 15px;
    }

    .fav-meta {
        font-size: 12px;
    }

    /* 管理界面优化 */
    .fav-manager-header {
        flex-direction: column;
        gap: 8px;
    }

    .fav-manager-header .btn {
        align-self: flex-start;
    }

    .fav-manager-search {
        width: 100%;
        font-size: 16px; /* 防止 iOS 自动缩放 */
        padding: 12px 14px;
    }

    .fav-category-filter {
        width: 100%;
        font-size: 16px;
        padding: 10px 12px;
    }

    .fav-manager-list {
        max-height: 50vh;
    }

    .fav-manager-item {
        flex-wrap: wrap;
        padding: 10px 12px;
        gap: 8px;
    }

    .fav-manager-icon {
        display: none;
    }

    .fav-manager-info {
        flex: 1 1 100%;
        order: 1;
    }

    .fav-manager-title {
        font-size: 15px;
    }

    .fav-manager-category {
        order: 2;
    }

    .fav-manager-actions {
        order: 3;
        margin-left: auto;
    }

    .fav-manager-actions .btn {
        padding: 8px 14px;
        font-size: 13px;
    }

    .fav-pagination {
        padding: 8px 0;
    }

    .fav-pagination .btn {
        padding: 10px 16px;
    }

    /* 对话框优化。弹窗保持居中：贴底的底部抽屉会被手机浏览器的地址栏与
       Home 指示条盖住，与 .ui-dialog 是同一类缺陷。内边距改为四边吃安全区，
       底部再减去软键盘遮挡高度（--kb-inset 由 app.js 写入，无键盘时为 0）。 */
    .fav-dialog-overlay {
        padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + var(--kb-inset, 0px) + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
        align-items: center;
    }

    .fav-dialog {
        max-width: 100%;
        border-radius: 14px;
        padding: 16px 14px;
        max-height: calc(88dvh - var(--kb-inset, 0px));
        overflow-y: auto;
    }

    .fav-form input,
    .fav-form select {
        font-size: 16px;
        padding: 12px 14px;
    }

    .fav-category-row {
        flex-direction: column;
    }

    .fav-dialog-actions {
        gap: 10px;
    }

    .fav-dialog-actions .btn {
        flex: 1;
        padding: 12px;
        font-size: 15px;
    }

    .fav-actions {
        flex-direction: column;
    }

    .fav-actions .btn {
        width: 100%;
        padding: 12px;
        font-size: 14px;
    }
}

/* 小屏手机适配 */
@media (max-width: 480px) {
    .fav-dropdown {
        max-height: min(55vh, 360px);
        max-height: min(55dvh, 360px);
        left: 0;
        right: 0;
        border-radius: 11px;
    }

    .fav-item {
        padding: 10px 12px;
    }

    .fav-manager-list {
        max-height: 45vh;
    }

    .fav-manager-item {
        padding: 8px 10px;
    }

    .fav-manager-title {
        font-size: 14px;
    }

    .fav-manager-url {
        font-size: 10px;
    }
}

/* iPad / 平板适配 */
@media (min-width: 769px) and (max-width: 1024px) {
    .fav-dropdown {
        max-height: 450px;
    }

    .fav-manager-header {
        flex-wrap: nowrap;
    }

    .fav-manager-list {
        max-height: 450px;
    }

    .fav-manager-item {
        padding: 10px 14px;
    }

    .fav-dialog {
        max-width: 500px;
    }
}

/* 横屏模式优化 */
@media (max-height: 500px) and (orientation: landscape) {
    .fav-dropdown {
        max-height: min(55vh, 300px);
        max-height: min(55dvh, 300px);
        position: absolute;
        top: calc(100% + 8px);
        bottom: auto;
        left: 0;
        right: 0;
        width: auto;
        transform: none;
        border-radius: var(--radius);
    }

    .fav-dialog-overlay {
        align-items: center;
    }

    .fav-dialog {
        border-radius: 12px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .help-content {
        max-height: 88dvh;
        overflow-y: auto;
    }

    /* 引擎下拉原本没有 max-height：12 个引擎时高 442px，横屏 844×390 下
       超出视口 199px 且无法滚动，后 6 个引擎完全点不到。 */
    .engine-dropdown {
        max-height: min(60dvh, 300px);
        overflow-y: auto;
        overscroll-behavior: contain;
    }

    /* 搜索栏保留 44px 触摸高度（横屏也需可点），只把行高收到按钮加内边距的下限。 */
    .search { min-height: 54px; }
}

/* 触摸优化 */
@media (hover: none) and (pointer: coarse) {
    .fav-item,
    .fav-manager-item,
    .btn {
        -webkit-tap-highlight-color: transparent;
    }

    .fav-item:active,
    .fav-manager-item:active {
        background: var(--bg-hover);
        transition: none;
    }

    /* 增大触摸区域 */
    .fav-manager-actions .btn {
        min-height: 36px;
        min-width: 60px;
    }

    .fav-pagination .btn {
        min-height: 40px;
        min-width: 80px;
    }
}

/* ========== 版本更新提示 ========== */

/* ========== WebDAV 远程备份 ========== */

.webdav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-secondary);
}

.webdav-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
}

.webdav-status-dot.active {
    background: #22c55e;
}

.webdav-last-backup {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
}

.webdav-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
}

.webdav-row {
    display: flex;
    gap: 8px;
}

.webdav-row input[type="url"],
.webdav-row input[type="text"],
.webdav-row input[type="password"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
}

.webdav-row input:focus {
    outline: none;
    border-color: var(--accent);
}

.webdav-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);

}

.webdav-row input[type="checkbox"] {
    width: 16px;

    cursor: pointer;
}

.webdav-row-half {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.webdav-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.webdav-message {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    min-height: 20px;
}

.webdav-message:empty {
    display: none;
}

.webdav-message.success {
    background: #dcfce7;
    color: #166534;
}

.webdav-message.error {

}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .webdav-message.success {

    :root:not([data-theme="light"]) .webdav-message.error {

:root[data-theme="dark"] .webdav-message.success {

    color: #86efac;
}

:root[data-theme="dark"] .webdav-message.error {
    background: #450a0a;
    color: #fca5a5;
}

.webdav-loading {
    padding: 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
}

/* WebDAV 恢复对话框 */
.webdav-restore-dialog {
    max-width: 500px;
}

.webdav-backup-list {
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 16px;
}

.webdav-backup-item {
    padding: 12px;
    border: 1px solid var(--border);

.webdav-backup-item:hover {

}

.webdav-backup-item:last-child {
    margin-bottom: 0;
}

.webdav-backup-info {

    min-width: 0;
}

.webdav-backup-actions {

.webdav-backup-actions .btn-sm {
    padding: 4px 10px;

.webdav-backup-name {

.webdav-backup-meta {

/* 移动端适配 */
@media (max-width: 768px) {

    .webdav-actions {

/* ========== 版本更新提示 (continued) ========== */

/* 帮助按钮更新徽章：「说明」有新版本时的提示点。
   原先挂在右下角圆形按钮的右上角（绝对定位），底栏改成纯文字后那个角落
   不再存在，改为文本行内的小红点：它跟着字号与行盒走，窄屏把链接撑到
   44px 高也不会跑偏。 */
.site-footer-link.has-update::after {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 4px;
    vertical-align: 2px;
    background: #ef4444;
    border-radius: 50%;
    animation: badgePulse 2s ease-in-out infinite;
}

@keyframes badgePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
}

/* 新功能区块 */

}

@media (prefers-color-scheme: dark) {

}

:root[data-theme="dark"] .help-new-features-header {

.help-new-features-summary {

@media (prefers-color-scheme: dark) {

:root[data-theme="dark"] .help-new-features-summary {

/* ========== 可折叠区块 ========== */

.section-collapsible {
    margin-bottom: 32px;
}

.section-collapsible:last-child {
    margin-bottom: 0;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);

}

.section-header:hover {

}

.section-header .section-title {

}

.section-toggle-icon {

.section-header.expanded .section-toggle-icon {

}

.section-body.collapsed {
    display: none;
}

/* ========== 恢复选项 ========== */

.restore-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
}

.restore-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all var(--transition);
}

.restore-option:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
}

.restore-option input[type="radio"] {
    margin-top: 2px;
    flex-shrink: 0;
}

.restore-option span {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
}

/* ========== 批量操作栏 ========== */

.fav-batch-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
}

.fav-select-all {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
}

.fav-select-all input {
    cursor: pointer;
}

.fav-selected-count {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
}

/* ========== 分类拖放区 ========== */

.fav-category-zones {
    display: none; /* 已被树状分类替代 */
}

/* ========== 分割布局 ========== */

.fav-manager-split {
    display: flex;
    gap: 16px;
    height: 100%;
    min-height: 400px;
}

.fav-manager-sidebar {
    width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    padding-right: 12px;
    overflow: hidden;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
}

.fav-manager-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

/* ========== 树状分类 ========== */

.category-tree {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
}

.category-tree-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: all var(--transition);
    user-select: none;
}

.category-tree-item:hover {
    background: var(--bg-hover);
    color: var(--text);
}

.category-tree-item.active {
    background: var(--accent);
    color: white;
}

.category-tree-item.drag-over {
    background: var(--accent);
    color: white;
    box-shadow: 0 0 0 2px var(--accent-hover);
}

.tree-toggle {
    width: 12px;
    font-size: 10px;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform var(--transition);
}

.tree-toggle-placeholder {
    width: 12px;
    flex-shrink: 0;
}

.tree-item-icon {
    font-size: 14px;
    flex-shrink: 0;
}

.tree-item-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tree-item-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
}

.category-tree-item.active .tree-item-count {
    background: rgba(255,255,255,0.2);
    color: white;
}

.category-tree-children {
    overflow: hidden;
    transition: max-height 0.2s ease;
}

.category-tree-children.collapsed {
    display: none;
}

.category-tree-new {
    border: 1px dashed var(--border);
    margin-top: 8px;
    color: var(--text-muted);
}

.category-tree-new:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: transparent;
}

/* 分类编辑按钮 */
.tree-item-edit {
    display: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 12px;
    flex-shrink: 0;
    margin-left: 4px;
}

.category-tree-item:hover .tree-item-edit {
    display: inline-block;
}

.tree-item-edit:hover {
    color: var(--accent);
}

.category-tree-item.active .tree-item-edit {
    color: rgba(255,255,255,0.7);
}

.category-tree-item.active .tree-item-edit:hover {
    color: white;
}

/* 分类编辑输入框 */
.tree-item-edit-input {
    flex: 1;
    min-width: 60px;
    padding: 2px 6px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
}

.tree-item-name.editing {
    display: none;
}

/* ========== 书签拖拽 ========== */

.fav-drag-handle {
    cursor: grab;
    color: var(--text-muted);
    font-size: 12px;
    padding: 4px;
    flex-shrink: 0;
}

.fav-drag-handle:active {
    cursor: grabbing;
}

.fav-manager-item.dragging {
    opacity: 0.5;
    background: var(--bg-hover);
}

.fav-manager-item[draggable="true"] {
    cursor: default;
}

.fav-checkbox {
    flex-shrink: 0;
    cursor: pointer;
    width: 16px;
    height: 16px;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .fav-batch-bar {
        flex-wrap: wrap;
        gap: 8px;
    }

    .fav-batch-bar .btn {
        flex: 1;
        min-width: 100px;
    }

    /* 树状分类移动端适配 */
    .fav-manager-split {
        flex-direction: column;
    }

    .fav-manager-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-right: 0;
        padding-bottom: 12px;
        max-height: 180px;
    }

    .category-tree {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0;
    }

    .category-tree-item {
        padding: 6px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
    }

    .category-tree-children {
        display: none;
    }

    .tree-toggle,
    .tree-toggle-placeholder {
        display: none;
    }

    .restore-options {
        gap: 10px;
    }

    .restore-option {
        padding: 10px;
    }

    .restore-option span {
        font-size: 13px;
    }

    .fav-drag-handle {
        display: none;
    }
}

/* 帮助弹窗标题优化 */
.help-content h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .help-new-features {
        padding: 10px 12px;
        margin-bottom: 14px;
    }

    .help-new-features-header {
        font-size: 13px;
    }

    .help-new-features-summary {
        font-size: 12px;
    }
}

/* 2026 front-end material and interaction layer */
:root {
    color-scheme: light;
    --bg: #efede8;
    --bg-card: #faf8f4;
    --bg-hover: #f2ece5;
    --text: #302b27;
    --text-secondary: #655e57;
    --text-muted: #817970;
    --border: rgba(92,76,64,.18);
    --divider-rgb: 92,76,64;
    --bookmark-face: linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.08) 38%,rgba(121,105,91,.025)),linear-gradient(165deg,rgba(251,249,245,.86),rgba(238,235,230,.90));
    --bookmark-hover-face: linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.12) 40%,rgba(121,105,91,.035)),linear-gradient(165deg,rgba(253,251,247,.92),rgba(237,233,227,.94));
    --bookmark-pressed-face: linear-gradient(180deg,rgba(101,81,64,.17),rgba(255,255,255,.02) 54%,rgba(255,255,255,.11)),linear-gradient(165deg,#e8e3dc,#f5f1eb);
    --bookmark-border: rgba(116,100,85,.20);
    --bookmark-hover-border: rgba(148,94,74,.37);
    --bookmark-pressed-border: rgba(103,85,69,.34);
    /* 常态/悬停都带真实外投影——与深色同构。此前浅色只有内阴影，
       书签「浮起来」时身后没有影子跟着，平面感出不来；
       深色因为常态就带 --shadow、悬停带 --shadow-lg，手感才正确。 */
    --bookmark-idle-shadow: inset 0 1px rgba(255,255,255,.74),inset 0 -1px rgba(120,102,86,.11),inset 1px 0 rgba(255,255,255,.12),var(--shadow);
    --bookmark-hover-shadow: inset 0 1px rgba(255,255,255,.87),inset 0 -1px rgba(120,102,86,.16),inset 1px 0 rgba(255,255,255,.18),var(--shadow-lg);
    --bookmark-press-shadow: inset 0 3px 6px rgba(91,72,56,.26),inset 0 0 0 1px rgba(121,98,77,.09),inset 0 -1px rgba(255,255,255,.48);
    --bookmark-glint: var(--glint);
    /* 悬停抬升与深色一致（-2px）：两套主题共用同一套「抬起 + 影子跟随」
       机制。此前浅色 -1px、深色 -2px，同样是机制不一致的一例。 */
    --bookmark-lift: -2px;
    --bookmark-press-depth: 1px;
    --bookmark-press-scale: .975;
    --bookmark-glow-opacity: .32;
    --bookmark-glow-motion: 85ms;
    --bookmark-motion: 90ms;
    --bookmark-press-motion: 35ms;
    --accent: #945e4a;
    --accent-hover: #79503f;
    --focus: rgba(148,94,74,.58);
    --glass: rgba(252,250,246,.66);
    --glass-strong: rgba(252,250,246,.91);
    --card-bottom: #f0ede7;
    --control-top: #fcfaf6;
    --control-bottom: #eee9e1;
    --control-hover-top: #fffdf9;
    --control-hover-bottom: #f4eee6;
    --control-pressed-top: #e9e2d9;
    --control-pressed-bottom: #f1ece5;
    --glint: rgba(179,111,73,.34);
    --search-glint: rgba(179,111,73,.20);
    /* 悬浮光感的高光层：与仿真一致，书签与搜索框的 ::before/::after 共用。
       缺这一层时两层光晕叠在一起显得灰、糊，正是「说不上哪里不精致」的来源。 */
    --glint-white: rgba(255,255,255,.90);
    /* 浅色的投影比旧值（.06/.1）强、但比深色（.3/.5）弱。
       旧值在米色底上几乎不可见，导致浅色下按钮「抬起来却看不到影子」——
       深色之所以手感正确，正是因为它有真实外投影在跟。
       这组值取中间强度：米色底比深色亮，需要更强的黑才读得出，
       但不宜到深色那档，否则浅色整体会显得发脏。 */
    --shadow: 0 1px 3px rgba(60,45,32,.11),0 4px 10px rgba(60,45,32,.07);
    --shadow-lg: 0 4px 10px rgba(60,45,32,.10),0 14px 30px rgba(60,45,32,.15);
    --press-shadow: inset 0 2px 5px rgba(91,70,55,.20),inset 0 -1px rgba(255,255,255,.55);
    --radius: 10px;
    /* 搜索栏三按钮的色相锚点：同族拟物，仅色相微偏以区分功能。
       深浅两套必须成对改，见下方两个深色块。 */
    --mode-hue: 106,124,132;      /* 网页/书签：青灰 */
    --engine-hue: 168,128,78;     /* 引擎：琥珀 */
    --submit-hue: 148,94,74;      /* 搜索：陶土 */
    --ctl-h: 44px;                /* 触摸目标下限，不可下调 */
    --ctl-press-shadow: inset 0 4px 9px rgba(88,66,50,.32),inset 0 0 0 1px rgba(121,98,77,.12),inset 0 -1px rgba(255,255,255,.42);
    --ctl-press-motion: 28ms;
}

        --press-shadow: inset 0 3px 7px rgba(0,0,0,.45),inset 0 -1px rgba(255,255,255,.08);
        /* 与 :root 的三色锚点成对定义，缺一份则手动深色与系统深色表现分叉 */
        --mode-hue: 138,160,168;
        --engine-hue: 208,162,96;
        --submit-hue: 223,169,140;

        --ctl-press-motion: 28ms;
    }

body { font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif; }
/* 1040 → 1440：给背板外侧的两侧模块留位置（936 背板 + 2×220 模块 + 间隙）。
   背板本身仍是 936px 居中，宽度未变。 */
.app { max-width: 1440px; padding: 35px 22px 56px; }
.header { margin-bottom: 0; }
.search-wrapper { max-width: 560px; }
.search {
    --glow-x: 50%; --glow-y: 0%; position: relative; min-height: 56px;
    padding: 5px; border-color: rgba(132,109,92,.24); border-radius: 13px;
    background: linear-gradient(165deg,var(--glass-strong),var(--glass));
    box-shadow: inset 0 1px rgba(255,255,255,.76),inset 0 -1px rgba(105,81,63,.08),0 3px 8px rgba(67,51,39,.045),0 12px 27px rgba(67,51,39,.065);
    backdrop-filter: blur(18px) saturate(125%); -webkit-backdrop-filter: blur(18px) saturate(125%);

    transition: min-height var(--transition), padding var(--transition), border-radius var(--transition), border-color 160ms, box-shadow 160ms, background 160ms;
}
/* 顶边 1px 受光高光。::after 已被光感占用，所以这条用 ::before。
   仿真 .search-shell::before 同样存在，此前移植时整块漏掉——
   背板加了 padding-top 后，搜索框顶与背板顶拉开 20px，
   框自身若没有这条高光，会在这道缝里显得缺一道亮边。 */
.search::before { content: ''; position: absolute; left: 11px; right: 11px; top: 0; height: 1px; pointer-events: none; background: linear-gradient(90deg,transparent,rgba(255,255,255,.95) 30%,rgba(255,255,255,.95) 70%,transparent); }
/* 光感与 .bookmark::before 同构：中性白高光 + 色相光晕。
   单层时两层光晕叠在一起偏灰；仿真就是双层，这里对齐。 */
.search::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(ellipse 77px 51px at var(--glow-x) var(--glow-y),var(--glint-white),transparent 68%),radial-gradient(ellipse 105px 52px at var(--glow-x) var(--glow-y),var(--search-glint),transparent 82%); opacity: 0; transition: opacity 85ms; }
.search:hover { border-color: rgba(148,94,74,.33); box-shadow: inset 0 1px rgba(255,255,255,.82),0 4px 10px rgba(67,51,39,.055),0 13px 27px rgba(67,51,39,.07); }
.search:hover::after { opacity: .40; }
.search:focus-within { border-color: var(--focus); box-shadow: inset 0 2px 5px rgba(91,70,55,.10),inset 0 0 0 1px rgba(255,255,255,.52),0 4px 12px rgba(67,51,39,.07),0 0 0 3px rgba(148,94,74,.065); }
:root[data-theme="dark"] .search:focus-within { background: rgba(44,39,35,.83); box-shadow: inset 0 3px 8px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 3px rgba(223,169,140,.08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .search:focus-within { background: rgba(44,39,35,.83); box-shadow: inset 0 3px 8px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 3px rgba(223,169,140,.08); } }
/* 搜索栏三按钮：同族拟物 + 三色相偏移。
   各自的 --HUE 是唯一的色相来源，光感与按压阴影都从它派生，
   三个按钮因此共享同一套结构、只在色相与明度上分层。 */
.search-mode,.search-engine,.search-btn {
    --glow-x: 50%; --glow-y: 0%; position: relative; z-index: 1; flex: 0 0 auto;
    height: var(--ctl-h); min-height: var(--ctl-h); padding: 0 10px; overflow: hidden;

.bookmark::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 77px 51px at var(--glow-x) var(--glow-y),var(--glint-white),transparent 68%),radial-gradient(ellipse 103px 69px at var(--glow-x) var(--glow-y),var(--bookmark-glint),transparent 82%); opacity: .17; transition: opacity var(--bookmark-glow-motion); }

.bookmark:focus-visible,.btn:focus-visible,.site-footer-link:focus-visible,.search-mode:focus-visible,.search-btn:focus-visible,.search-engine:focus-visible,.fav-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
