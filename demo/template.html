<!DOCTYPE html>
<!--
  Habu 演示页 · 源模板

  这是给人看的**演示**：所有内容都是虚构示例，不含任何真实账号、服务器地址、
  凭据或私人数据；页面不与后台通信，是一个纯静态文件（零网络请求、零 CPU）。

  本文件是「源」，成品是 public/demo/index.html —— 由 demo/build.js 把产品真实
  的样式表内联进来后生成，它随 public/ 一起发版，服务器上直接以
  https://<你的域名>/demo/ 对外提供（静态文件不经过登录门禁）。

  改样式请改 public/styles.css，改完跑 `node demo/build.js` 重新生成。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Habu 演示页面：导航、备忘待办、服务器监控与订阅时间线的演示示例，全部内容为虚构数据。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#211f1c">
<title>Habu 演示 · 个人数字工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23211f1c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c28d70' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
/*__PRODUCT_CSS__*/

/* ================= 演示页自有样式（不依赖后台） ================= */

/* 备忘模块在产品里是「平台壳 + 模块自己的卡面」两层叠着：壳有 --glass 底，
   .memo-card 又画一层 --bookmark-face（再加一道 inset 阴影），而服务器卡是
   单元素、只有一层——三张卡并排时备忘卡明显多一层底。

   这里只把内层那层多余的面去掉，底色、边框、阴影一律由外层平台壳承担：
   材质仍跟着主题走（棱镜是 prism-slab，经典是 --glass），不需要复制主题内部值。 */
.module-widget[data-widget="memo"] > .memo-card {
    background: none;
    box-shadow: none;
}
.module-widget[data-widget="memo"] > .memo-card::before { display: none; }

/* 时间线卡片沿用产品的紧凑内边距（产品里靠 data-module-id 命中这条规则）。 */
.module-widget[data-module-id="special-line"] { padding-inline: 9px; }

/* 小标签：只标在订阅时间线卡头上（那是唯一引用真实账号名的地方）。 */
.demo-tag {
    padding: 1px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--accent);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
}

/* 说明弹窗：产品里的对话框样式在 admin.css（后台专用），演示页自己带一套。 */
.demo-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(24, 19, 16, .46);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}
.demo-modal-overlay[hidden] { display: none; }
.demo-modal {
    width: min(520px, 100%);
    max-height: 82vh;
    overflow: auto;
    padding: 22px 24px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--glass-strong);
    box-shadow: var(--shadow-lg);
    color: var(--text);
}
.demo-modal h2 { margin-bottom: 12px; font-size: 15px; font-weight: 600; }
.demo-modal p { margin-bottom: 10px; color: var(--text-secondary); font-size: 13px; line-height: 1.75; }
.demo-modal ul { margin: 0 0 14px 18px; color: var(--text-secondary); font-size: 13px; line-height: 1.9; }
.demo-modal-foot { display: flex; justify-content: flex-end; margin-top: 16px; }

/* 演示页的明暗开关：与右上角的主题样式开关同族，只是多一组。 */
.demo-toolbar-group { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="app" id="app">
    <div class="backboard">

/* ================= 模块区排布（移植产品平台的同一套判据） ================= */

/**
 * 三列宽度的连续解：左侧普通模块列、时间线宽列、中间导航背板。
 * 与 app.js 的 railLayoutFor() 同源——Special Line 声明了 wideRail，
 * 需要一条真宽度的列，放不下就整体退回「模块在下方横排」。
 */
function railLayoutFor(content) {
    const GAP = 20;
    const SIDE_MIN = 280, SIDE_MAX = 320;
    const BOARD_MIN = 600, BOARD_MAX = 936;
    const RAIL_MIN = 400, RAIL_MAX = 440;

    let side = SIDE_MAX;
    let rail = RAIL_MAX;
    let board = content - 2 * GAP - side - rail;

    if (board > BOARD_MAX) {
        board = BOARD_MAX;
        rail = Math.min(RAIL_MAX, content - 2 * GAP - side - board);
    }
    if (board < BOARD_MIN) {
        rail = Math.max(RAIL_MIN, content - 2 * GAP - side - BOARD_MIN);
        board = content - 2 * GAP - side - rail;
    }
    if (board < BOARD_MIN) {
        side = Math.max(SIDE_MIN, content - 2 * GAP - BOARD_MIN - rail);
        board = content - 2 * GAP - side - rail;
    }
    if (board < BOARD_MIN || rail < RAIL_MIN) return null;
    return { side, board, rail };
}

function syncRail() {
    const app = $('#app');
    const content = app.getBoundingClientRect().width - 22 * 2;
    const layout = railLayoutFor(content);
    app.dataset.rail = layout ? 'wide' : 'narrow';
    const vars = {
        '--rail-w': layout && layout.rail,
        '--side-w': layout && layout.side,
        '--board-max': layout && layout.board
    };
    for (const key of Object.keys(vars)) {
        if (vars[key]) app.style.setProperty(key, vars[key] + 'px');
        else app.style.removeProperty(key);
    }
    return layout;
}

function sideDockAvailable(boardWidth) {
    const MIN_SIDE = 280;
    const GAP = 20;
    const board = $('.backboard');
    const app = $('#app');
    if (!board || !app) return false;
    const measured = Number.isFinite(boardWidth) ? boardWidth : board.getBoundingClientRect().width;
    const appWidth = app.getBoundingClientRect().width;
    const side = (appWidth - 22 * 2 - measured) / 2;
    return side >= MIN_SIDE + GAP;
}

/** 模块列顶端对齐搜索框，而不是钉在页面最上沿（数值实测，不写死）。 */
function alignModuleTop() {
    const app = $('#app');
    const zone = $('#moduleZone');
    if (!app || !zone) return;
    if (zone.dataset.dock !== 'outside') {
        app.style.removeProperty('--module-top');
        return;
    }
    const header = $('.header');
    if (!header) return;
    const top = Math.round(header.getBoundingClientRect().top - app.getBoundingClientRect().top);
    app.style.setProperty('--module-top', top + 'px');
}

function applyDock() {
    const layout = syncRail();
    const zone = $('#moduleZone');
    zone.dataset.dock = sideDockAvailable(layout && layout.board) ? 'outside' : 'below';
    alignModuleTop();
    stackCards();
}

function stackCards() {
    const zone = $('#moduleZone');
    if (!zone || zone.dataset.dock !== 'outside') return;
    const GAP = 14;
    for (const side of ['left', 'right']) {
        const nodes = [...zone.querySelectorAll(`.module-widget[data-side="${side}"]`)];
        for (const node of nodes) node.style.removeProperty('--stack-top');
        let cursor = 0;
        for (const node of nodes) {
            node.style.setProperty('--stack-top', cursor + 'px');
            cursor += node.getBoundingClientRect().height + GAP;
        }
    }
}

/* ================= 外观 ================= */

let modePref = 'dark';   // 明暗偏好；棱镜只有深色一档，切到经典时恢复

function applyThemeStyle(style) {
    const root = document.documentElement;
    root.setAttribute('data-theme-style', style);
    // 棱镜固定深色（与产品一致：THEMES.prism.mode = 'dark'），
    // 所以这一档下浅色按钮不可用。
    const fixedDark = style === 'prism';
    const lightBtn = $('#demoModeSwitcher button[data-demo-mode="light"]');
    lightBtn.disabled = fixedDark;
    lightBtn.title = fixedDark ? '棱镜只有深色一档' : '切换为浅色';
    $$('#homeThemeSwitcher button').forEach(btn =>
        btn.setAttribute('aria-pressed', String(btn.dataset.homeTheme === style)));
    applyMode(fixedDark ? 'dark' : modePref);
    applyDock();
}

function applyMode(mode) {
    if (mode === 'light' && document.documentElement.getAttribute('data-theme-style') === 'prism') return;
    modePref = mode;
    document.documentElement.setAttribute('data-theme', mode);
    $$('#demoModeSwitcher button').forEach(btn =>
        btn.setAttribute('aria-pressed', String(btn.dataset.demoMode === mode)));
    requestAnimationFrame(stackCards);
}

/* ================= 搜索 ================= */

let favMode = false;
let engine = ENGINES[0];
let filterText = '';

function setMode(next) {
    favMode = next;
    const btn = $('#modeBtn');
    btn.querySelector('[data-label="web"]').hidden = favMode;
    btn.querySelector('[data-label="fav"]').hidden = !favMode;
    btn.setAttribute('aria-pressed', String(favMode));
    btn.setAttribute('aria-label', favMode ? '切换搜索模式，当前为书签' : '切换搜索模式，当前为网页');
    const input = $('#searchInput');
    input.setAttribute('aria-label', favMode ? '搜索书签' : '搜索网页');
    input.placeholder = favMode ? '查书签' : '搜索网页';
    input.value = favMode ? input.value.replace(/^[\/、]{1,2}/, '') : `/${input.value}`;
    applyFilter(input.value);
}

function applyFilter(value) {
    filterText = (favMode ? value : value.replace(/^[\/、]{1,2}/, '')).trim().toLowerCase();
    let hits = 0;
    $$('#grid .bookmark').forEach(el => {
        const title = el.querySelector('.bookmark-title').textContent.toLowerCase();
        const match = !filterText || title.includes(filterText);
        el.hidden = !match;
        if (match) hits++;
    });
    $$('#grid .category').forEach(cat => {
        const visible = $$('.bookmark', cat).some(el => !el.hidden);
        cat.hidden = !visible;
    });
    const count = $('#demoSearchCount');
    if (filterText) {
        count.hidden = false;
        count.textContent = `${hits} 个匹配`;
    } else {
        count.hidden = true;
    }
}

function submitSearch() {
    const input = $('#searchInput');
    const raw = input.value.trim();
    if (favMode) {
        const hit = $$('#grid .bookmark').find(el => !el.hidden);
        if (hit) window.open(hit.href, '_blank', 'noopener');
        else toast('没有匹配的导航');
        return;
    }
    const query = raw.replace(/^[\/、]{1,2}/, '');
    if (!query) { toast('先输入关键词'); return; }
    window.open(engine.url + encodeURIComponent(query), '_blank', 'noopener');
}

/* ================= 说明弹窗 ================= */

function openModal(title, html) {
    $('#demoModalTitle').textContent = title;
    $('#demoModalBody').innerHTML = html;
    $('#demoModalOverlay').hidden = false;
    $('#demoModalClose').focus();
}

function closeModal() {
    $('#demoModalOverlay').hidden = true;
}

/* ================= 绑定 ================= */

function bind() {
    // 搜索
    $('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); submitSearch(); });
    $('#searchInput').addEventListener('input', (e) => applyFilter(e.target.value));
    $('#searchInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitSearch(); }
    });
    $('#modeBtn').addEventListener('click', () => setMode(!favMode));
    document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== $('#searchInput')) {
            e.preventDefault();
            $('#searchInput').focus();
        }
    });

    // 搜索引擎下拉
    const dropdown = $('#engineDropdown');
    dropdown.innerHTML = ENGINES.map((e, i) =>
        `<button type="button" role="option" data-engine="${i}" aria-selected="${i === 0}">${esc(e.name)}</button>`).join('');
    $('#engineBtn').addEventListener('click', () => {
        const open = dropdown.hidden;
        dropdown.hidden = !open;
        $('#engineBtn').setAttribute('aria-expanded', String(open));
    });
    dropdown.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-engine]');
        if (!btn) return;
        engine = ENGINES[Number(btn.dataset.engine)];
        $('#engineName').textContent = engine.name;
        dropdown.hidden = true;
        $('#engineBtn').setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
            dropdown.hidden = true;
            $('#engineBtn').setAttribute('aria-expanded', 'false');
        }
    });

    // 主题
    $('#homeThemeSwitcher').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-home-theme]');
        if (btn) applyThemeStyle(btn.dataset.homeTheme);
    });
    $('#demoModeSwitcher').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-demo-mode]');
        if (btn) applyMode(btn.dataset.demoMode);
    });

    // 模块区：备忘 / 待办切换、勾选待办、时间线筛选、收藏、详情
    const zone = $('#moduleZone');
    zone.addEventListener('click', (e) => {
        const tab = e.target.closest('[data-tab]');
        if (tab) {
            $$('.memo-tab').forEach(b => b.setAttribute('aria-selected', String(b === tab)));
            const isTodo = tab.dataset.tab === 'todo';
            $('#memoBody').innerHTML = isTodo ? todoCardHTML() : memoCardHTML();
            $('#memoCount').textContent = isTodo
                ? `共 ${TODOS.length} 项 · ${TODOS.filter(t => !t.done).length} 未完成`
                : `共 ${MEMOS.length} 条`;
            requestAnimationFrame(stackCards);
            return;
        }
        const star = e.target.closest('[data-star]');
        if (star) {
            const item = star.closest('.special-line-item');
            item.dataset.favorited = item.dataset.favorited === '1' ? '0' : '1';
            star.textContent = item.dataset.favorited === '1' ? '已收藏' : '收藏';
            toast(item.dataset.favorited === '1' ? '已加入收藏（演示）' : '已取消收藏（演示）');
            return;
        }
        const detail = e.target.closest('[data-detail]');
        if (detail) {
            const s = SERVERS.find(x => x.name === detail.dataset.detail);
            openModal(`${s.name} · 监控详情`, `
                <p>演示指标。</p>
                <ul>
                    <li>地址：${esc(s.host)}（示例地址）</li>
                    <li>CPU：${s.cpu}%　内存：${s.mem}%</li>
                    <li>存储：${esc(s.diskUsed)} / ${esc(s.diskTotal)}</li>
                    <li>CPU 核心：${esc(s.cores)}</li>
                    <li>运行时长：${esc(s.uptime)}</li>
                </ul>`);
        }
    });
    zone.addEventListener('change', (e) => {
        const box = e.target.closest('.memo-todo-check');
        if (!box) return;
        const todo = TODOS[Number(box.dataset.todo)];
        todo.done = box.checked;
        const count = $('#memoCount');
        count.textContent = `共 ${TODOS.length} 项 · ${TODOS.filter(t => !t.done).length} 未完成`;
        requestAnimationFrame(stackCards);
    });

    // 时间线筛选
    $$('.special-line-chip').forEach(chip => chip.addEventListener('click', () => {
        const isView = chip.hasAttribute('data-view');
        const group = isView ? '[data-view]' : '[data-channel]';
        $$(group).forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
        applyTimelineFilter();
    }));
    $('#syncBtn').addEventListener('click', () => toast('演示页面：没有真实订阅可同步'));
    $('#saveBtn').addEventListener('click', () => toast('演示页面：保存功能未接入'));
    $('#memoManage').addEventListener('click', () => toast('演示页面：管理面板未接入'));

    // 说明
    $('#helpBtn').addEventListener('click', () => openModal('关于这个演示', `
        <p>Habu（个人数字工作台）的对外演示页。待办、备忘、订阅时间线与服务器指标都是虚构示例。</p>
        <p>整页是纯静态文件：不连接后台、不发起网络请求、不保存任何数据。</p>
        <p>导航分类指向公开网站，可直接点开体验。</p>`));
    $('#demoModalClose').addEventListener('click', closeModal);
    $('#demoModalOverlay').addEventListener('click', (e) => {
        if (e.target === $('#demoModalOverlay')) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('#demoModalOverlay').hidden) closeModal();
    });

    window.addEventListener('resize', () => {
        clearTimeout(window.__demoDockTimer);
        window.__demoDockTimer = setTimeout(applyDock, 120);
    });
}

function applyTimelineFilter() {
    const channel = $('.special-line-chip[data-channel][aria-pressed="true"]')?.dataset.channel ?? '';
    const view = $('.special-line-chip[data-view][aria-pressed="true"]')?.dataset.view ?? 'all';
    let visible = 0;
    $$('#eventList .special-line-item').forEach(item => {
        const inChannel = !channel || item.dataset.channel === channel;
        const favorited = item.dataset.favorited === '1';
        const inView = view === 'all' || (view === 'favorited' && favorited) || (view === 'archived' && item.dataset.archived === '1');
        const show = inChannel && inView;
        item.hidden = !show;
        if (show) visible++;
    });
    let empty = $('#eventEmpty');
    if (!visible) {
        if (!empty) {
            empty = document.createElement('div');
            empty.id = 'eventEmpty';
            empty.className = 'special-line-empty';
            empty.innerHTML = '<p>当前筛选下没有内容。演示数据里只有几条示例。</p>';
            $('#eventList').after(empty);
        }
        empty.hidden = false;
    } else if (empty) {
        empty.hidden = true;
    }
}

/* ================= 启动 ================= */

renderGrid();
renderModules();
bind();
applyThemeStyle('prism');
applyMode('dark');
requestAnimationFrame(applyDock);
})();
</script>
</body>
</html>
