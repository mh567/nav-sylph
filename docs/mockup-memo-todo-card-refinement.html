<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>备忘 / 待办卡片 · 交互仿真</title>
<style>
/* 实际材质 token 摘自 public/styles.css:2450–2625；不依赖外部资源。 */
:root{color-scheme:light;--bg:#efede8;--bg-card:#faf8f4;--bg-hover:#f2ece5;--text:#302b27;--text-secondary:#655e57;--text-muted:#817970;--border:rgba(92,76,64,.18);--accent:#945e4a;--accent-hover:#79503f;--focus:rgba(148,94,74,.58);--glass:rgba(252,250,246,.66);--glass-strong:rgba(252,250,246,.91);--card-bottom:#f0ede7;--control-top:#fcfaf6;--control-bottom:#eee9e1;--control-hover-top:#fffdf9;--control-hover-bottom:#f4eee6;--shadow:0 1px 3px rgba(60,45,32,.11),0 4px 10px rgba(60,45,32,.07);--shadow-lg:0 4px 10px rgba(60,45,32,.10),0 14px 30px rgba(60,45,32,.15);--press-shadow:inset 0 2px 5px rgba(91,70,55,.20),inset 0 -1px rgba(255,255,255,.55);--radius:10px}
:root[data-theme="dark"]{color-scheme:dark;--bg:#211f1c;--bg-card:#3a3530;--bg-hover:#4a4139;--text:#f3eee8;--text-secondary:#c9beb3;--text-muted:#a89c90;--border:rgba(222,203,185,.18);--accent:#c28d70;--accent-hover:#d4a181;--focus:rgba(223,169,140,.68);--glass:rgba(65,58,51,.70);--glass-strong:rgba(57,51,46,.93);--card-bottom:#2c2925;--control-top:#625951;--control-bottom:#3c3630;--control-hover-top:#71655b;--control-hover-bottom:#4a4139;--shadow:0 2px 4px rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.20);--shadow-lg:0 5px 10px rgba(0,0,0,.18),0 18px 34px rgba(0,0,0,.35);--press-shadow:inset 0 3px 7px rgba(0,0,0,.45),inset 0 -1px rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid var(--border);border-radius:7px;padding:6px 11px;background:linear-gradient(180deg,var(--control-top),var(--control-bottom));box-shadow:inset 0 1px rgba(255,255,255,.45),var(--shadow)}button:hover{background:linear-gradient(180deg,var(--control-hover-top),var(--control-hover-bottom))}button:active{box-shadow:var(--press-shadow)}:focus-visible{outline:2px solid var(--focus);outline-offset:3px}[hidden]{display:none!important}
.toolbar{max-width:980px;margin:24px auto 0;padding:16px 20px;border:1px solid var(--border);border-radius:13px;background:linear-gradient(165deg,var(--glass-strong),var(--glass));backdrop-filter:blur(18px);box-shadow:var(--shadow)}.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}.control{display:flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:12px}select{min-height:32px;max-width:100%;padding:4px 7px;border:1px solid var(--border);border-radius:7px;background:var(--bg-card)}.notice{margin:12px 0 0;font-size:12px;color:var(--text-muted)}.stage{min-height:510px;padding:64px 24px 40px;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:20px;background:radial-gradient(ellipse at 50% 20%,var(--glass),transparent 65%)}.card{width:220px;flex:none;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(165deg,var(--glass-strong),var(--glass)),linear-gradient(165deg,var(--bg-card),var(--card-bottom));backdrop-filter:blur(18px) saturate(125%);box-shadow:inset 0 1px rgba(255,255,255,.55),inset 0 -1px rgba(105,81,63,.08),var(--shadow-lg)}
.card-first{display:flex;justify-content:center;padding:10px 8px 7px}.tabs{display:flex;gap:2px;width:112px;max-width:100%;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--bg-hover)}.tab{flex:1;min-width:0;min-height:25px;padding:0 5px;border:0;border-radius:5px;background:transparent;color:var(--text-secondary);font-size:11px;box-shadow:none;white-space:nowrap}.tab[aria-selected="true"]{background:var(--bg-card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(67,51,39,.08)}
.rows{max-height:240px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:0 6px 4px;outline-offset:-3px}.row{display:flex;gap:6px;align-items:center;min-height:33px;padding:3px 3px;border-radius:7px}.row:hover{background:var(--bg-hover)}.row+.row{border-top:1px solid var(--border)}.item{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none!important;box-shadow:none!important;padding:5px 0;font-size:12px;cursor:pointer}.item:hover{color:var(--accent)}.item.done{text-decoration:line-through;color:var(--text-muted);font-style:italic}.check-wrap{display:flex;align-items:center;justify-content:center;width:23px;height:27px;flex:none;cursor:pointer}input[type="checkbox"]{accent-color:var(--accent);width:15px;height:15px;margin:0}.memo-icon{color:var(--accent);flex:none;width:15px;display:grid;place-items:center}.empty{padding:22px 3px;text-align:center;font-size:11px;color:var(--text-muted)}.footer{border-top:1px solid var(--border);padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;font-size:10px;color:var(--text-muted)}.count{white-space:nowrap}.status{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}.status-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;flex:none}.link{padding:0;border:0;border-radius:2px;background:none!important;box-shadow:none;font-size:10px;text-decoration:underline;text-underline-offset:2px;color:var(--accent);white-space:nowrap}.manage{margin-left:auto}.drag-footer{border-top:1px solid var(--border);padding:3px 0;display:flex;justify-content:center;background:var(--bg-hover)}.drag-handle{touch-action:none;cursor:grab;border:0;padding:2px 12px;background:none!important;box-shadow:none;color:var(--text-muted);font-size:15px;line-height:20px}.drag-handle:active{cursor:grabbing}.stage-note{font-size:11px;color:var(--text-muted);text-align:center;margin:0;max-width:450px}.live{min-height:20px;color:var(--text-secondary);font-size:12px;text-align:center;margin:0 20px 24px}
dialog{padding:0;width:min(540px,calc(100vw - 28px));max-height:85vh;overflow:auto;color:var(--text);border:1px solid var(--border);border-radius:13px;background:linear-gradient(165deg,var(--glass-strong),var(--bg-card));box-shadow:var(--shadow-lg);backdrop-filter:blur(18px)}dialog::backdrop{background:rgba(30,25,21,.4);backdrop-filter:blur(3px)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:13px 18px}.panel-head h2{font-size:15px;margin:0}.panel-body{padding:16px 18px}.panel-note{font-size:11px;color:var(--text-muted);margin:0 0 14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:12px;color:var(--text-secondary)}input[type="text"],textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:9px 11px;box-shadow:var(--press-shadow);resize:vertical}textarea{min-height:100px}.done-field{display:flex;align-items:center;gap:8px;margin-top:12px}.panel-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}.primary{color:var(--bg-card);background:var(--accent)!important}.panel-list{max-height:240px;overflow-y:auto;overscroll-behavior:contain}.panel-list .item{white-space:normal;overflow-wrap:anywhere}.panel-list .row{align-items:flex-start}.panel-list .check-wrap{margin-top:3px}.panel-tabs{margin-bottom:12px}.error{color:var(--accent);font-size:12px;margin:8px 0 0}@media(max-width:600px){.toolbar{margin:12px;padding:12px}.stage{padding-top:36px;align-items:safe center}.controls{gap:10px}.card-first{padding-top:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<section class="toolbar" aria-label="仿真工具栏">
<div class="controls">
<label class="control">主题 <select id="theme"><option value="light">强制浅色</option><option value="dark">强制深色</option></select></label>
<label class="control">卡宽 <select id="width"><option value="132">132px</option><option value="220" selected>220px</option><option value="400">400px</option></select></label>
<label class="control">数据 <select id="dataset"><option value="normal">标准 · 20 条</option><option value="empty">空 · 0 条</option><option value="few">少 · 3 条</option><option value="long">长文字 · 20 条</option></select></label>
<label class="control">同步 <select id="sync"><option value="success">成功</option><option value="failed">失败 / 重试</option><option value="pending">待同步</option></select></label>
<label class="control"><input id="layout" type="checkbox"> 编辑布局</label>
</div>
<p class="notice">交互仿真 · 全部为虚构演示数据。保存、勾选和同步仅改变当前页面内存，不接入服务、不真实持久化；刷新即重置。</p>
</section>
<main class="stage" id="stage">
<article class="card" id="card" aria-label="备忘与待办卡片">
<div class="card-first"><div class="tabs" role="tablist" aria-label="备忘与待办"><button class="tab" id="tab-memo" role="tab" aria-controls="rows" aria-selected="true" data-tab="memo">备忘</button><button class="tab" id="tab-todo" role="tab" aria-controls="rows" aria-selected="false" tabindex="-1" data-tab="todo">待办</button></div></div>
<div class="rows" id="rows" role="tabpanel" aria-labelledby="tab-memo" tabindex="0"></div>
<footer class="footer"><span class="count" id="count"></span><span class="status" id="status" role="status"></span><button class="link manage" id="manage">管理</button></footer>
<div class="drag-footer" id="dragFooter" hidden><button class="drag-handle" id="dragHandle" aria-label="拖动卡片；方向键移动，Home 复位" title="拖动移动；方向键移动，Home 复位">⠿</button></div>
</article>
<p class="stage-note">卡片首行仅居中页签 · 全量列表原生滚动，上限 240px<br>点待办文字直接编辑对应项；底部「管理」打开列表面板。</p>
</main>
<p class="live" id="live" role="status" aria-live="polite"></p>
<dialog id="panel" aria-labelledby="panelTitle">
<div class="panel-head"><h2 id="panelTitle">管理</h2><button id="close" aria-label="关闭模拟面板">×</button></div>
<div class="panel-body"><p class="panel-note">模拟面板 · 保存仅在本页生效，取消 / Esc 放弃未保存编辑。</p>
<div id="manager"><div class="tabs panel-tabs" role="group" aria-label="面板数据类型"><button class="tab" data-manage-tab="memo">备忘</button><button class="tab" data-manage-tab="todo">待办</button></div><div class="panel-list" id="panelList"></div></div>
<form id="editor" hidden><label class="field"><span id="textLabel">待办内容</span><textarea id="editText" maxlength="200" required></textarea></label><label class="field" id="bodyField" hidden>备忘正文<textarea id="editBody" maxlength="10240"></textarea></label><label class="done-field" id="doneField"><input type="checkbox" id="editDone"> 已完成</label><p class="error" id="error" hidden>请输入内容，不能仅为空格。</p></form>
</div><div class="panel-actions" id="actions" hidden><button id="cancel">取消</button><button class="primary" type="submit" form="editor">保存（仿真）</button></div>
</dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const titles=['周末植物养护','阅读清单整理','社区图书角提案','手冲咖啡练习','城市散步路线','春日配色灵感','整理桌面收纳','烘焙配方记录','纸张材质比较','公开展览笔记','插画构图练习','窗边光线观察','学习快捷键','整理示例图标','编写公开教程','设计圆角对照','补充演示文案','无障碍体验记录','检查预览布局','下周学习安排'];
const tasks=['给绿植浇水','归还图书馆书籍','整理公开素材目录','试做一份燕麦饼干','完成十分钟速写','散步时观察街角招牌','给示例插画添加说明','检查按钮键盘焦点','清理书桌上的草稿纸','阅读一篇设计文章','准备周末野餐清单','给演示照片分类','记录三种纸张手感','整理练习用调色板','复习五个快捷键','更新公开阅读清单','检查窄卡片文字省略','为示例图标补充标签','安排下一次学习练习','整理今天的学习笔记'];
let active='memo',data={memo:[],todo:[]},editing=null,sync='success',retryTimer=null,offset={x:0,y:0};
const scroll={memo:0,todo:0};
function announce(text){$('live').textContent=text;}
function loadData(){const mode=$('dataset').value,n=mode==='empty'?0:mode==='few'?3:20;data={memo:[],todo:[]};for(let i=0;i<n;i++){const suffix=mode==='long'?'：这是一段用于验证窄宽省略、完整面板编辑与长内容阅读的虚构演示文字，请在面板中查看完整内容。':'';data.memo.push({id:i+1,text:titles[i]+suffix,body:'公开示例笔记 '+(i+1)+'。这里只记录虚构的学习与生活灵感，不含任何私人信息。',done:false});data.todo.push({id:i+1,text:tasks[i]+suffix,done:i%6===4});}scroll.memo=scroll.todo=0;render();}
function row(item,kind){const el=document.createElement('div');el.className='row';if(kind==='todo'){const label=document.createElement('label');label.className='check-wrap';const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','完成：'+item.text);check.onchange=()=>{item.done=check.checked;markPending();render();announce('已'+(item.done?'完成':'恢复')+'第 '+item.id+' 条待办（仅内存）。');};label.append(check);el.append(label);}else{const icon=document.createElement('span');icon.className='memo-icon';icon.textContent='▤';icon.setAttribute('aria-hidden','true');el.append(icon);}const btn=document.createElement('button');btn.className='item'+(item.done?' done':'');btn.textContent=item.text;btn.title=item.text;btn.setAttribute('aria-label','编辑第 '+item.id+' 条'+(kind==='todo'?'待办：':'备忘：')+item.text);btn.onclick=()=>openEditor(item.id,kind);el.append(btn);return el;}
function fillList(target,kind){target.replaceChildren();if(!data[kind].length){const p=document.createElement('p');p.className='empty';p.textContent=kind==='memo'?'暂无备忘':'暂无待办';target.append(p);}else data[kind].forEach(item=>target.append(row(item,kind)));}
function renderStatus(){const el=$('status');el.replaceChildren();const dot=document.createElement('span');dot.className='status-dot';el.append(dot);el.append(document.createTextNode(sync==='success'?'已同步':sync==='failed'?'同步失败':sync==='retrying'?'重试中…':'待同步'));if(sync==='failed'){const retry=document.createElement('button');retry.className='link';retry.textContent='重试';retry.onclick=()=>{sync='retrying';renderStatus();announce('正在模拟重试，不会发送网络请求。');retryTimer=setTimeout(()=>{sync='success';$('sync').value='success';renderStatus();announce('模拟重试成功，数据仍仅在本页内存。');},850);};el.append(retry);}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{const selected=b.dataset.tab===active;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});$('rows').setAttribute('aria-labelledby','tab-'+active);fillList($('rows'),active);$('rows').scrollTop=scroll[active];$('count').textContent=data[active].length+' 条';renderStatus();if($('panel').open&&!editing)renderManager();}
function markPending(){clearTimeout(retryTimer);sync='pending';$('sync').value='pending';}
function switchTab(kind){active=kind;render();}
$('rows').onscroll=()=>{scroll[active]=$('rows').scrollTop;};
document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>switchTab(b.dataset.tab);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();switchTab(e.key==='Home'?'memo':e.key==='End'?'todo':active==='memo'?'todo':'memo');$('tab-'+active).focus();}};});
function renderManager(){document.querySelectorAll('[data-manage-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.manageTab===active)));fillList($('panelList'),active);$('panelTitle').textContent=active==='memo'?'备忘管理 · 仿真':'待办管理 · 仿真';}
function openEditor(id,kind){const item=data[kind].find(x=>x.id===id);editing={id,kind};$('manager').hidden=true;$('editor').hidden=false;$('actions').hidden=false;$('error').hidden=true;$('textLabel').textContent=kind==='todo'?'待办内容（最多 200 字）':'备忘标题（最多 60 字）';$('editText').maxLength=kind==='todo'?200:60;$('editText').value=item.text;$('editBody').value=item.body||'';$('editDone').checked=item.done;$('bodyField').hidden=kind==='todo';$('doneField').hidden=kind==='memo';$('panelTitle').textContent='编辑第 '+id+' 条'+(kind==='todo'?'待办':'备忘')+' · 仿真';if(!$('panel').open)$('panel').showModal();$('editText').focus();$('editText').setSelectionRange(0,$('editText').value.length);}
function closePanel(){editing=null;$('panel').close();}
$('manage').onclick=()=>{editing=null;$('editor').hidden=true;$('actions').hidden=true;$('manager').hidden=false;renderManager();$('panel').showModal();};
document.querySelectorAll('[data-manage-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.manageTab;render();});
$('editor').onsubmit=e=>{e.preventDefault();const text=$('editText').value.trim();if(!text){$('error').hidden=false;$('editText').focus();return;}const item=data[editing.kind].find(x=>x.id===editing.id);item.text=text;item.done=editing.kind==='todo'&&$('editDone').checked;if(editing.kind==='memo')item.body=$('editBody').value;markPending();closePanel();render();announce('已保存修改（仿真），等待模拟同步；刷新后不会保留。');};
$('cancel').onclick=()=>{closePanel();announce('已取消，未保存的文字与勾选已丢弃。');};$('close').onclick=closePanel;$('panel').addEventListener('cancel',()=>{editing=null;announce('已关闭面板，未保存编辑不生效。');});
$('theme').onchange=()=>document.documentElement.dataset.theme=$('theme').value;
$('width').onchange=()=>{$('card').style.width=$('width').value+'px';resetPosition();};
$('dataset').onchange=()=>{loadData();announce('已重置为所选虚构演示数据。');};
$('sync').onchange=()=>{clearTimeout(retryTimer);sync=$('sync').value;renderStatus();announce('同步状态为手动仿真，未执行真实同步。');};
function paintPosition(){$('card').style.transform=`translate(${offset.x}px,${offset.y}px)`;}
function resetPosition(){offset={x:0,y:0};paintPosition();}
$('layout').onchange=()=>{$('dragFooter').hidden=!$('layout').checked;resetPosition();announce($('layout').checked?'布局编辑已开启：独立底部把手可拖动，方向键可移动。':'布局编辑已关闭，卡片位置复位。');};
let drag=null;const handle=$('dragHandle');
handle.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};handle.setPointerCapture(e.pointerId);};handle.onpointermove=e=>{if(!drag)return;offset={x:Math.max(-60,Math.min(60,drag.ox+e.clientX-drag.x)),y:Math.max(-30,Math.min(80,drag.oy+e.clientY-drag.y))};paintPosition();};
handle.onpointerup=()=>{if(drag)announce('已模拟移动卡片；布局不会持久化。');drag=null;};handle.onpointercancel=()=>drag=null;
handle.onkeydown=e=>{const moves={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]};if(e.key==='Home'){e.preventDefault();resetPosition();}else if(moves[e.key]){e.preventDefault();offset.x=Math.max(-60,Math.min(60,offset.x+moves[e.key][0]));offset.y=Math.max(-30,Math.min(80,offset.y+moves[e.key][1]));paintPosition();}};
loadData();
</script>
</body>
</html>
