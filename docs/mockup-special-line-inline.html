<!doctype html>
<html lang="zh-CN" data-theme="dark" data-variant="sidebar" data-state="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Line · 首页内联版式对比</title>
<style>
:root {
    color-scheme: light;
    --bg: #efede8;
    --bg-card: #faf8f4;
    --bg-hover: #f2ece5;
    --text: #302b27;
    --text-secondary: #655e57;
    --text-muted: #817970;
    --border: rgba(92,76,64,.18);
    --divider-rgb: 92,76,64;
    --accent: #945e4a;
    --accent-hover: #79503f;
    --focus: rgba(148,94,74,.58);
    --glass: rgba(252,250,246,.72);
    --glass-strong: rgba(252,250,246,.94);
    --control-top: #fcfaf6;
    --control-bottom: #eee9e1;
    --shadow: 0 1px 3px rgba(60,45,32,.11), 0 4px 10px rgba(60,45,32,.07);
    --shadow-lg: 0 4px 10px rgba(60,45,32,.10), 0 14px 30px rgba(60,45,32,.15);
    --warning: #9b702a;
    --danger: #a44c46;
}
[data-theme="dark"] {
    color-scheme: dark;
    --bg: #211f1c;
    --bg-card: #3a3530;
    --bg-hover: #4a4139;
    --text: #f3eee8;
    --text-secondary: #c9beb3;
    --text-muted: #a89c90;
    --border: rgba(222,203,185,.18);
    --divider-rgb: 222,203,185;
    --accent: #c28d70;
    --accent-hover: #d4a181;
    --focus: rgba(223,169,140,.68);
    --glass: rgba(65,58,51,.76);
    --glass-strong: rgba(57,51,46,.96);
    --control-top: #625951;
    --control-bottom: #3c3630;
    --shadow: 0 2px 4px rgba(0,0,0,.12), 0 10px 28px rgba(0,0,0,.20);
    --shadow-lg: 0 5px 10px rgba(0,0,0,.18), 0 18px 34px rgba(0,0,0,.35);
    --warning: #e0bd7a;
    --danger: #e9a69d;
}
* { box-sizing: border-box; }
body { min-width: 320px; min-height: 100vh; margin: 0; padding: 96px 20px 60px; background: var(--bg); color: var(--text);
       font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; transition: background 160ms, color 160ms; }
button, input, select { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- 对比工具栏（只是拿来对比用，不是产品的一部分） ---------- */
.toolbar { position: fixed; z-index: 9; inset: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
           padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--glass-strong); box-shadow: var(--shadow); }
.toolbar-title { color: var(--text-secondary); font-size: 12px; font-weight: 650; letter-spacing: .04em; }
.toolbar-note { margin-left: auto; color: var(--text-muted); font-size: 10px; }
.control { display: inline-flex; align-items: center; gap: 6px; }
.control-label { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.segmented { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--glass); }
.segmented button { min-height: 26px; padding: 2px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
.segmented button:hover { background: var(--bg-hover); color: var(--text); }
.segmented button[aria-pressed="true"] { background: var(--control-bottom); color: var(--text); font-weight: 650; box-shadow: inset 0 1px 3px rgba(0,0,0,.16); }

/* ---------- 首页外框：应用容器 + 背板 + 右侧模块列 ---------- */
.stage { width: 100%; margin: 0 auto; transition: max-width 200ms; }
.stage[data-viewport="1440"] { max-width: 1440px; }
.stage[data-viewport="1280"] { max-width: 1280px; }
.stage[data-viewport="390"]  { max-width: 390px; }
.caption { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 10px; }
.surface { position: relative; min-height: 640px; padding: 18px clamp(14px, 3vw, 22px) 40px; background: var(--bg); }
/* 关键：这一行就是「背板 + 右侧时间线」的并排关系。
   变体 A 把背板收窄，让右侧拿到真宽度；变体 B 背板不动，右列还是原来那 210px。 */
.row { display: flex; align-items: flex-start; gap: 20px; justify-content: center; }
.board { flex: 1 1 auto; min-width: 0; max-width: 936px; }
.stage[data-variant="sidebar"] .board { max-width: 768px; }
.stage[data-variant="sidebar"] .rail { flex: 0 0 auto; width: 420px; }
.stage[data-variant="narrow"] .rail { flex: 0 0 auto; width: 210px; }

.brandline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.search { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--glass); box-shadow: var(--shadow); color: var(--text-muted); font-size: 13px; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--glass); box-shadow: var(--shadow); }
.cat h3 { margin: 0 0 8px; font-size: 12px; font-weight: 620; color: var(--text-secondary); }
.cat div { padding: 4px 0; color: var(--text-muted); font-size: 11px; }
.rail-note { margin: 10px 2px 0; color: var(--text-muted); font-size: 10px; line-height: 1.6; }

/* ---------- 时间线 ---------- */
.tl { border: 1px solid var(--border); border-radius: 12px; background: var(--glass); box-shadow: var(--shadow); }
.tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tl-head h2 { margin: 0; font-size: 14px; font-weight: 620; }
.tl-sub { color: var(--text-muted); font-size: 10px; }
.tl-status { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--accent); font-size: 10px; }
.tl-status b { color: var(--text-secondary); font-weight: 600; }
.tl-btn { min-height: 26px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: linear-gradient(180deg, var(--control-top), var(--control-bottom)); box-shadow: var(--shadow); color: var(--text-secondary); font-size: 11px; }
.tl-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); color: var(--text); }
.tl-btn-primary { border-color: transparent; background: var(--accent); color: #fffaf5; font-weight: 620; }

.tl-filters { display: flex; align-items: center; gap: 4px; padding: 7px 10px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tl-chip { min-height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.tl-chip[aria-pressed="true"] { border-color: var(--border); background: var(--glass-strong); color: var(--accent); font-weight: 650; }
.tl-sep { width: 1px; height: 18px; margin: 0 3px; background: var(--border); flex: 0 0 auto; }

.tl-list { margin: 0; padding: 6px 12px 10px; list-style: none; max-height: 460px; overflow-y: auto; }
.stage[data-variant="sidebar"] .tl-list { max-height: 560px; }
.tl-item { position: relative; display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 16px; padding: 9px 0 14px; }
.tl-item::before { position: absolute; z-index: 1; top: 22px; left: 78px; width: 9px; height: 9px; border: 2px solid var(--bg-card); border-radius: 50%; background: var(--accent); content: ""; }
.tl-item[data-unread="true"]::before { width: 11px; height: 11px; top: 21px; left: 77px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.tl-line { position: absolute; top: 16px; bottom: 18px; left: 82px; width: 1px; background: linear-gradient(var(--border), rgba(var(--divider-rgb),.27) 88%, transparent); }
.tl-time { padding-top: 17px; color: var(--text-muted); text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
.tl-time strong { display: block; margin-bottom: 3px; color: var(--text-secondary); font-size: 11px; font-weight: 570; }
.tl-card { min-width: 0; padding: 11px 12px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--glass-strong); box-shadow: var(--shadow); transition: transform 150ms, box-shadow 150ms; }
.tl-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.tl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--text-muted); font-size: 9px; }
.tl-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); font-weight: 630; }
.tl-icon { display: inline-grid; width: 17px; height: 17px; place-items: center; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-card); color: var(--accent); font-size: 9px; font-weight: 700; }
.tl-type { color: var(--text-muted); font-size: 9px; }
.tl-tools { position: relative; margin-left: auto; }
.tl-tools summary { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--text-muted); font-size: 16px; line-height: 1; list-style: none; cursor: pointer; }
.tl-tools summary::-webkit-details-marker { display: none; }
.tl-tools summary:hover, .tl-tools[open] summary { background: var(--bg-hover); color: var(--text-secondary); }
.tl-actions { position: absolute; z-index: 3; top: calc(100% + 4px); right: 0; display: grid; min-width: 112px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--glass-strong); box-shadow: var(--shadow-lg); }
.tl-act { min-height: 30px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text-secondary); font-size: 11px; text-align: left; white-space: nowrap; }
.tl-act:hover { background: var(--bg-hover); color: var(--accent); }
.tl-card h3 { margin: 0 0 6px; font-size: 13px; line-height: 1.45; font-weight: 610; overflow-wrap: anywhere; }
.tl-card h3 a { color: inherit; text-decoration: none; }
.tl-card h3 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.tl-card p { margin: 0; color: var(--text-secondary); font-size: 11px; line-height: 1.65; }
.tl-card blockquote { margin: 8px 0 0; padding: 7px 10px; border-left: 2px solid color-mix(in srgb, var(--accent) 62%, transparent); border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--bg-hover) 72%, transparent); color: var(--text-secondary); font-size: 10px; line-height: 1.6; }
.tl-foot { padding: 8px 14px 10px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 10px; display: flex; justify-content: space-between; gap: 8px; }

/* 窄版（沿用仿真样例 ≤700px 的那套）：时间移到卡片上方、竖线贴左、单列 */
.stage[data-variant="narrow"] .tl-item { display: block; padding: 8px 0 14px; }
.stage[data-variant="narrow"] .tl-line { top: 12px; bottom: 14px; left: 10px; }
.stage[data-variant="narrow"] .tl-item::before { top: 30px; left: 5px; }
.stage[data-variant="narrow"] .tl-item[data-unread="true"]::before { top: 29px; left: 4px; }
/* <time> 默认是行内元素：不显式 block 的话它的 padding 盒会压到下面那张卡的上沿 */
.stage[data-variant="narrow"] .tl-time { display: block; padding: 6px 0 6px 24px; text-align: left; }
.stage[data-variant="narrow"] .tl-time strong { display: inline; margin: 0 6px 0 0; }
.stage[data-variant="narrow"] .tl-card { margin-left: 24px; }
.stage[data-variant="narrow"] .tl-list { padding-inline: 10px; }
.stage[data-variant="narrow"] .tl-head, .stage[data-variant="narrow"] .tl-foot { padding-inline: 12px; }
.stage[data-variant="narrow"] .tl-sub { display: none; }

.tl-empty { padding: 26px 16px; color: var(--text-muted); text-align: center; font-size: 11px; line-height: 1.7; }
.tl-notice { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 12px 0; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--warning) 38%, var(--border)); border-radius: 8px; background: color-mix(in srgb, var(--warning) 8%, var(--glass)); color: var(--text-secondary); font-size: 10px; line-height: 1.6; }
.tl-notice strong { color: var(--warning); }
[data-state="empty"] .tl-list, [data-state="empty"] .tl-foot { display: none; }
[data-state="empty"] .tl-empty { display: block; }
[data-state="empty"] .tl-notice { display: none; }
.tl-empty { display: none; }
[data-state="failed"] .tl-notice { display: flex; }
.tl-notice { display: none; }

/* 窄屏：与平台一致——模块区不再并排，落到分类网格**下方**（app.js 的
   sideDockAvailable 判定余量不足时就是这么切的） */
@media (max-width: 760px) {
    .row { flex-direction: column; }
    .stage[data-variant="sidebar"] .board,
    .stage[data-variant="narrow"] .board { max-width: none; }
    .stage[data-variant="sidebar"] .rail,
    .stage[data-variant="narrow"] .rail { width: 100%; }
    .stage .tl-list { max-height: none; }
}

@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div class="toolbar" role="group" aria-label="对比工具栏">
    <span class="toolbar-title">Special Line · 首页内联版式</span>
    <span class="control"><span class="control-label">主题</span>
        <span class="segmented" data-control="theme">
            <button type="button" data-value="dark">深色</button>
            <button type="button" data-value="light">浅色</button>
        </span></span>
    <span class="control"><span class="control-label">视口</span>
        <span class="segmented" data-control="viewport">
            <button type="button" data-value="1440">1440</button>
            <button type="button" data-value="1280">1280</button>
            <button type="button" data-value="390">390</button>
        </span></span>
    <span class="control"><span class="control-label">内容</span>
        <span class="segmented" data-control="state">
            <button type="button" data-value="normal">正常</button>
            <button type="button" data-value="empty">空态</button>
            <button type="button" data-value="failed">同步失败</button>
        </span></span>
    <span class="toolbar-note">A = 缩窄背板换宽度；B = 背板不动</span>
</div>

<main class="stage" id="stage" data-viewport="1440" data-variant="sidebar">
    <div class="caption"><span id="variant-caption">变体 A：背板收窄到 768px，右侧时间线拿到 420px —— 能完整还原仿真里的桌面版（左侧日期轨道 + 事件卡）</span><span id="vp-label">1440 px</span></div>
    <section class="surface">
        <div class="row">
            <!-- 背板：首页原有的分类网格 -->
            <div class="board">
                <div class="brandline">
                    <div class="search">搜索或输入网址…</div>
                </div>
                <div class="cats" id="cats"></div>
            </div>

            <!-- 右侧模块列：Special Line 内联 -->
            <aside class="rail">
                <div class="tl" id="tl">
                    <div class="tl-head">
                        <h2>Special Line</h2>
                        <span class="tl-sub">动态 · 稍后阅读</span>
                        <span class="tl-status">已同步 <b>未读 3</b> · 14:20</span>
                        <button class="tl-btn" type="button" title="立即同步">↻</button>
                        <button class="tl-btn tl-btn-primary" type="button">＋ 保存</button>
                    </div>
                    <nav class="tl-filters" aria-label="时间线筛选">
                        <button class="tl-chip" type="button" aria-pressed="true">全部来源</button>
                        <button class="tl-chip" type="button" aria-pressed="false">X</button>
                        <button class="tl-chip" type="button" aria-pressed="false">微博</button>
                        <button class="tl-chip" type="button" aria-pressed="false">稍后阅读</button>
                        <span class="tl-sep" aria-hidden="true"></span>
                        <button class="tl-chip" type="button" aria-pressed="true">全部</button>
                        <button class="tl-chip" type="button" aria-pressed="false">未读</button>
                        <button class="tl-chip" type="button" aria-pressed="false">已归档</button>
                    </nav>
                    <div class="tl-notice" role="status"><strong>同步未完成</strong><span>保留了上次同步的事件。X · @northstar 需要重新授权，可到后台「模块」分区更新</span></div>
                    <ol class="tl-list" id="tl-list"></ol>
                    <div class="tl-empty">时间线还没有内容。订阅来源请在后台「模块」分区配置，也可以先保存一篇文章。</div>
                    <div class="tl-foot"><span>共 5 条</span><span>更新于 14:20</span></div>
                </div>
                <p class="rail-note" id="rail-note"></p>
            </aside>
        </div>
    </section>
</main>

<script>
(() => {
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const state = { theme: 'dark', viewport: '1440', content: 'normal', variant: 'sidebar' };

    const events = [
        { sym: 'X', source: 'X · @northstar', type: '博主推文', date: '今天', time: '11:18', unread: true,
          title: '一份关于个人知识管理的年度回顾', url: 'https://example.com/x-p1',
          summary: '把稍后阅读清单从「收藏夹」变成真正的工作流，关键不是读得更多，而是让每条保存都能回到一个具体问题。',
          quote: '先保存，再决定它值得不值得留下。' },
        { sym: '↗', source: '稍后阅读', type: '保存的文章', date: '今天', time: '09:02', unread: true,
          title: '如何建立一个能长期维护的个人信息系统', url: 'https://example.com/saved-1',
          summary: '文章讨论如何用少量稳定的分类和回顾机制，降低收藏越积越多却再也不看的问题。' },
        { sym: '微', source: '微博 · 城市观察员', type: '微博动态', date: '今天', time: '08:46', unread: true,
          title: '城市公共空间更新项目进入第二阶段', url: 'https://example.com/wb-w1',
          summary: '本周开始开放居民意见征集，现场说明会将于周五举行。具体时间和报名方式见原文。' },
        { sym: 'X', source: 'X · @northstar', type: '博主推文', date: '昨天', time: '21:18', unread: false,
          title: '阅读列表最重要的功能是允许你忘掉它', url: 'https://example.com/x-p2',
          summary: '把输入、暂存和回顾分开，才不会让每一次浏览都变成必须马上处理的任务。' },
        { sym: '↗', source: '稍后阅读', type: '保存的文章', date: '昨天', time: '16:05', unread: false,
          title: 'RSS 仍然是订阅内容的好方式吗？', url: 'https://example.com/saved-2',
          summary: '一篇关于开放订阅协议、平台接口与个人阅读习惯的长文。' }
    ];

    const cats = [
        ['常用', ['邮箱', '日历', '网盘', '笔记']],
        ['开发', ['GitHub', '文档', 'CI', '监控']],
        ['阅读', ['技术博客', '社区', '周刊', '播客']],
        ['工具', ['翻译', '图床', '剪贴板', '测试']]
    ];

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function renderCats() {
        $('#cats').innerHTML = cats.map(([name, items]) =>
            `<div class="cat"><h3>${esc(name)}</h3>${items.map(i => `<div>${esc(i)}</div>`).join('')}</div>`).join('');
    }
    function renderList() {
        const q = events.map(e => `
            <li class="tl-item" data-unread="${e.unread}">
                <span class="tl-line" aria-hidden="true"></span>
                <time class="tl-time"><strong>${esc(e.date)}</strong>${esc(e.time)}</time>
                <article class="tl-card">
                    <div class="tl-meta">
                        <span class="tl-mark"><span class="tl-icon" aria-hidden="true">${esc(e.sym)}</span>${esc(e.source)}</span>
                        <span class="tl-type">${esc(e.type)}</span>
                        <details class="tl-tools"><summary aria-label="事件操作">⋯</summary>
                            <div class="tl-actions">
                                <button class="tl-act" type="button">${e.unread ? '标为已读' : '标为未读'}</button>
                                <button class="tl-act" type="button">归档</button>
                            </div>
                        </details>
                    </div>
                    <h3><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a></h3>
                    <p>${esc(e.summary)}</p>
                    ${e.quote ? `<blockquote>${esc(e.quote)}</blockquote>` : ''}
                </article>
            </li>`).join('');
        $('#tl-list').innerHTML = q;
    }
    function refresh() {
        document.documentElement.dataset.theme = state.theme;
        document.body.dataset.state = state.content;
        const stage = $('#stage');
        stage.dataset.viewport = state.viewport;
        stage.dataset.variant = state.variant;
        $('#vp-label').textContent = state.viewport + ' px';
        $('#variant-caption').textContent = state.variant === 'sidebar'
            ? '变体 A：背板收窄到 768px，右侧时间线拿到 420px —— 能完整还原仿真里的桌面版（左侧日期轨道 + 事件卡）'
            : '变体 B：背板保持 936px 不动，右侧时间线还是原来那 210px —— 只能走仿真的窄版（时间在卡上方、竖线贴左）';
        $('#rail-note').innerHTML = state.variant === 'sidebar'
            ? '代价：1440 及以下，首页分类网格从 936px 收窄到 768px（每行少一列左右）。<br>好处：时间线是仿真里的桌面版形态。'
            : '好处：首页版式完全不动。<br>代价：这一列只有 210px，时间线只能是窄版，和仿真里的桌面版看着不一样。';
        for (const seg of $$('[data-control]')) {
            const key = seg.dataset.control;
            $$('button', seg).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === state[key])));
        }
        // 变体切换按钮由工具栏最右侧那两格代替
        const vb = $('#variant-buttons');
        if (vb) $$('button', vb).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === state.variant)));
    }
    for (const seg of $$('[data-control]')) {
        const key = seg.dataset.control;
        $$('button', seg).forEach(b => b.addEventListener('click', () => { state[key] = b.dataset.value; refresh(); }));
    }
    // 变体开关：插到工具栏（两格）
    const vseg = document.createElement('span');
    vseg.className = 'control';
    vseg.innerHTML = '<span class="control-label">版式</span><span class="segmented" id="variant-buttons">' +
        '<button type="button" data-value="sidebar">A 缩背板</button><button type="button" data-value="narrow">B 不动背板</button></span>';
    $('.toolbar-note').before(vseg);
    $$('#variant-buttons button').forEach(b => b.addEventListener('click', () => { state.variant = b.dataset.value; refresh(); }));

    renderCats();
    renderList();
    refresh();
})();
</script>
</body>
</html>
